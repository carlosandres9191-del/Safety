<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#C8281E">
<title>Safety CRM — Extintores Safety S.A.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap');

:root {
  --red:       #C8281E;
  --red-d:     #9E1F17;
  --red-l:     #FDF0EF;
  --red-m:     #F2C4C1;
  --amber:     #D97706;
  --amber-l:   #FEF3C7;
  --green:     #15803D;
  --green-l:   #DCFCE7;
  --blue:      #1D4ED8;
  --blue-l:    #DBEAFE;
  --purple:    #7C3AED;
  --purple-l:  #EDE9FE;
  --teal:      #0F766E;
  --teal-l:    #CCFBF1;

  --ink:       #111111;
  --ink-2:     #333333;
  --ink-3:     #666666;
  --ink-4:     #999999;
  --border:    #E8E8E6;
  --border-2:  #D0D0CC;
  --surface:   #F5F4F0;
  --surface-2: #EDECE8;
  --white:     #FFFFFF;

  --sidebar-w: 256px;
  --topbar-h:  60px;
  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow:    0 4px 16px rgba(0,0,0,.10);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.14);

  --font-display: 'Syne', sans-serif;
  --font-body:    'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }

body {
  font-family: var(--font-body);
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: inherit; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }

/* ── LAYOUT ── */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--ink);
  color: #fff;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 200;
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  overflow-y: auto;
}
#sidebar.collapsed { transform: translateX(-100%); }

.sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  display: flex; align-items: center; gap: 12px;
}
.sidebar-logo-icon {
  width: 40px; height: 40px;
  background: var(--red);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
  font-family: var(--font-display);
  font-weight: 800;
  color: #fff;
  letter-spacing: -1px;
}
.sidebar-logo-text { line-height: 1.25; }
.sidebar-logo-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  color: #fff;
}
.sidebar-logo-sub {
  font-size: 11px;
  color: rgba(255,255,255,.38);
  font-weight: 400;
}

.sidebar-user {
  margin: 12px 16px;
  padding: 10px 12px;
  background: rgba(255,255,255,.06);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--red);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.sidebar-user-info { min-width: 0; }
.sidebar-user-name { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-user-role { font-size: 11px; color: rgba(255,255,255,.4); }

.sidebar-section-label {
  padding: 12px 20px 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
}

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 20px;
  font-size: 13.5px;
  font-weight: 400;
  color: rgba(255,255,255,.6);
  border-left: 3px solid transparent;
  transition: all .18s;
  cursor: pointer;
  position: relative;
}
.nav-item:hover { color: #fff; background: rgba(255,255,255,.05); }
.nav-item.active {
  color: #fff;
  border-left-color: var(--red);
  background: rgba(200,40,30,.15);
  font-weight: 500;
}
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 99px;
  min-width: 18px;
  text-align: center;
}

.sidebar-bottom {
  margin-top: auto;
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,.08);
}

/* ── MAIN AREA ── */
#main {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  transition: margin-left .28s cubic-bezier(.4,0,.2,1);
}
#main.expanded { margin-left: 0; }

/* ── TOPBAR ── */
#topbar {
  height: var(--topbar-h);
  background: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: var(--shadow-sm);
}
.topbar-toggle {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: var(--ink-3);
  transition: background .15s;
}
.topbar-toggle:hover { background: var(--surface); }
.topbar-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  color: var(--ink);
}
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.status-online {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-3);
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  animation: pulse-green 2s infinite;
}
.status-dot.offline { background: var(--amber); animation: none; }
@keyframes pulse-green {
  0%,100% { box-shadow: 0 0 0 0 rgba(21,128,61,.4); }
  50% { box-shadow: 0 0 0 5px rgba(21,128,61,0); }
}

/* ── PAGE CONTENT ── */
#page-content {
  flex: 1;
  padding: 28px 28px;
  max-width: 1400px;
  width: 100%;
}

/* ── CARDS ── */
.card {
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.card-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--ink);
}
.card-body { padding: 20px 22px; }
.card-actions { margin-left: auto; display: flex; gap: 8px; }

/* ── STAT CARDS ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 20px 22px;
  display: flex; align-items: flex-start; gap: 14px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s, transform .2s;
}
.stat-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.stat-icon {
  width: 44px; height: 44px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.stat-info { min-width: 0; }
.stat-value {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1;
  color: var(--ink);
}
.stat-label { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.stat-trend { font-size: 11px; margin-top: 6px; font-weight: 500; }
.stat-trend.up { color: var(--green); }
.stat-trend.down { color: var(--red); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 500;
  transition: all .15s;
  white-space: nowrap;
  cursor: pointer;
}
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-d); }
.btn-secondary { background: var(--surface); color: var(--ink-2); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-outline { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
.btn-outline:hover { background: var(--red-l); }
.btn-ghost { background: transparent; color: var(--ink-3); }
.btn-ghost:hover { background: var(--surface); color: var(--ink); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #126833; }
.btn-amber { background: var(--amber); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 12px 24px; font-size: 15px; }
.btn-icon { padding: 8px; border-radius: var(--radius-sm); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ── BADGES ── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 600;
}
.badge-red    { background: var(--red-l);    color: var(--red-d); }
.badge-green  { background: var(--green-l);  color: var(--green); }
.badge-amber  { background: var(--amber-l);  color: var(--amber); }
.badge-blue   { background: var(--blue-l);   color: var(--blue); }
.badge-purple { background: var(--purple-l); color: var(--purple); }
.badge-teal   { background: var(--teal-l);   color: var(--teal); }
.badge-gray   { background: var(--surface-2); color: var(--ink-3); }

/* ── TABLES ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 10px 14px;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 12px 14px;
  font-size: 13.5px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface); }

/* ── FORMS ── */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 6px;
}
.form-label .required { color: var(--red); margin-left: 3px; }
.form-control {
  width: 100%;
  padding: 9px 13px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--ink);
  background: var(--white);
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}
.form-control:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(200,40,30,.1);
}
.form-control::placeholder { color: var(--ink-4); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.form-hint { font-size: 11.5px; color: var(--ink-4); margin-top: 5px; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(4px);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateY(20px);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-lg { max-width: 900px; }
.modal-sm { max-width: 420px; }
.modal-header {
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.modal-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
}
.modal-close {
  margin-left: auto;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: var(--ink-3);
  transition: background .15s;
}
.modal-close:hover { background: var(--surface); }
.modal-body { padding: 22px 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
}

/* ── ALERTS ── */
.alert {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  display: flex; align-items: flex-start; gap: 10px;
  margin-bottom: 16px;
}
.alert-red    { background: var(--red-l);    color: var(--red-d);  border: 1px solid var(--red-m); }
.alert-green  { background: var(--green-l);  color: var(--green);  border: 1px solid #a7f3c4; }
.alert-amber  { background: var(--amber-l);  color: var(--amber);  border: 1px solid #fcd97a; }
.alert-blue   { background: var(--blue-l);   color: var(--blue);   border: 1px solid #bfdbfe; }

/* ── TABS ── */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
.tab-btn {
  padding: 10px 18px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-3);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all .15s;
  cursor: pointer;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--red); border-bottom-color: var(--red); }

/* ── TIMELINE ── */
.timeline { position: relative; padding-left: 24px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 8px; top: 6px; bottom: 0;
  width: 2px;
  background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-dot {
  position: absolute;
  left: -20px; top: 4px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--white);
  border: 2px solid var(--red);
  z-index: 1;
}
.timeline-dot.done { background: var(--green); border-color: var(--green); }
.timeline-dot.pending { border-color: var(--border-2); }
.timeline-date { font-size: 11px; color: var(--ink-4); margin-bottom: 3px; }
.timeline-text { font-size: 13.5px; color: var(--ink-2); }
.timeline-user { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

/* ── SEARCH BAR ── */
.search-bar {
  position: relative;
  flex: 1;
  max-width: 320px;
}
.search-bar input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border: 1.5px solid var(--border);
  border-radius: 99px;
  font-size: 13.5px;
  background: var(--surface);
  outline: none;
  transition: border-color .15s;
}
.search-bar input:focus { border-color: var(--red); background: var(--white); }
.search-bar .search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--ink-4);
  font-size: 14px;
  pointer-events: none;
}

/* ── QR CONTAINER ── */
.qr-box {
  display: flex; flex-direction: column; align-items: center;
  gap: 12px; padding: 20px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 2px dashed var(--border-2);
}

/* ── PRIORITY INDICATORS ── */
.priority-high   { color: var(--red);   font-weight: 600; }
.priority-medium { color: var(--amber); font-weight: 600; }
.priority-low    { color: var(--green); font-weight: 600; }

/* ── OFFLINE BANNER ── */
#offline-banner {
  position: fixed; top: 0; left: 0; right: 0;
  background: var(--amber);
  color: #fff;
  text-align: center;
  padding: 8px;
  font-size: 13px;
  font-weight: 500;
  z-index: 9999;
  transform: translateY(-100%);
  transition: transform .3s;
}
#offline-banner.show { transform: translateY(0); }

/* ── TOAST ── */
#toast-container {
  position: fixed; bottom: 24px; right: 24px;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 9000;
}
.toast {
  background: var(--ink);
  color: #fff;
  padding: 12px 18px;
  border-radius: var(--radius);
  font-size: 13.5px;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 10px;
  min-width: 260px;
  animation: slideInToast .25s ease;
}
.toast.success { border-left: 4px solid var(--green); }
.toast.error   { border-left: 4px solid var(--red); }
.toast.info    { border-left: 4px solid var(--blue); }
@keyframes slideInToast {
  from { transform: translateX(110%); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-3);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }
.empty-state .empty-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink-2); margin-bottom: 6px; }
.empty-state .empty-sub { font-size: 14px; }

/* ── PAGE HEADER ── */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
}
.page-header-left {}
.page-header-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 24px;
  color: var(--ink);
  line-height: 1.2;
}
.page-header-sub { font-size: 13.5px; color: var(--ink-3); margin-top: 3px; }
.page-header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  :root { --sidebar-w: 0px; }
  #sidebar { transform: translateX(-256px); width: 256px; }
  #sidebar.mobile-open { transform: translateX(0); }
  #main { margin-left: 0 !important; }
  #page-content { padding: 16px; }
  .form-grid, .form-grid-3 { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .page-header { flex-direction: column; }
  .modal { margin: 0; border-radius: var(--radius) var(--radius) 0 0; }
  .modal-overlay { align-items: flex-end; padding: 0; }
}

@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr; }
}
</style>

<script>
// ── VARIABLES GLOBALES ─────────────────────────────
const SB_URL = 'https://ilivtsacimtffnaxgtwx.supabase.co';
const SB_KEY = 'sb_publishable_RBFJ8i1X9wO2F402TSUFiw_bUH8Ui0T';
const SB_HDR = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
let APP = {user:null, page:'dashboard', timer:null, watcher:null};
const CACHE = {
  get(k)   { try{return JSON.parse(localStorage.getItem('s_'+k)||'null');}catch{return null;} },
  set(k,v) { try{localStorage.setItem('s_'+k,JSON.stringify(v));}catch{} },
  all(k)   { return this.get(k)||[]; },
  find(k,id){ return this.all(k).find(x=>x.id===id); },

function getPending()    { return JSON.parse(localStorage.getItem('pending')||'[]'); }
function setPending(arr) { localStorage.setItem('pending', JSON.stringify(arr)); }

function encolarPending(accion, tabla, data) {
  const p = getPending();
  p.push({ accion, tabla, data, ts: now() });
  setPending(p);
  actualizarSync('pending');
}

function actualizarSync(estado) {
  const n = getPending().length;
  const el = document.getElementById('sync-texto');
  const badge = document.getElementById('sync-badge');
  if (el) {
    if (n > 0) { el.textContent=`⏳ ${n} pendientes`; el.style.color='var(--amber)'; }

  const tablas = ['clientes','extintores','recolecciones','entregas','laboratorio',
                  'materiales','visitas','alertas','prestamos','auditoria','usuarios'];
  actualizarSync('syncing');

  for (const t of tablas) {
    const data = await SB.get(t, '?select=*');
    if (data !== null) {
      // Normalizar campo contrasena -> password en usuarios
      if (t === 'usuarios') data.forEach(u=>{ if(u.contrasena&&!u.password) u.password=u.contrasena; });
      CACHE.set(t, data);
      ok++;

  }

  // Refrescar página actual
  if (STATE.currentPage) renderPage(STATE.currentPage);
  return ok;
}

// ── SINCRONIZAR PENDIENTES ────────────────────────
async function sincronizar() {
  const pending = getPending();
  if (!pending.length) { actualizarSync('ok'); return; }
  actualizarSync('syncing');
  const btn = document.getElementById('btn-sync');
  if (btn) { btn.textContent='🔄 Sincronizando...'; btn.disabled=true; }

  const fallidos = [];
  for (const item of pending) {
    try {
      let r;
      if (item.accion==='insert') r = await SB.upsert(item.tabla, item.data);
      else if (item.accion==='update') r = await SB.update(item.tabla, item.data.id, item.data);
      else if (item.accion==='delete') r = await SB.delete(item.tabla, item.data.id);
      if (!r && item.accion!=='delete') fallidos.push(item);
    } catch { fallidos.push(item); }
  }

  setPending(fallidos);
  actualizarSync(fallidos.length>0?'pending':'ok');
  if (btn) { btn.textContent='☁️ Sincronizar'; btn.disabled=false; }
  const ok = pending.length - fallidos.length;
  if (ok>0) { toast(`${ok} registro(s) sincronizados ✓`,'success'); cargarTodo(); }
}

function navigate(page) {

}

function updateOnlineStatus() {
  const banner=document.getElementById('offline-banner'),dot=document.getElementById('status-dot'),txt=document.getElementById('status-text');
  if(!banner)return;
  if(!navigator.onLine){ banner.classList.add('show'); if(dot)dot.className='status-dot offline'; if(txt)txt.textContent='Sin conexión'; }
  else{ banner.classList.remove('show'); if(dot)dot.className='status-dot'; if(txt)txt.textContent='En línea'; sincronizar(); }
}

function generarUrlMapa(ubicaciones, mensajeros) {
  const activas = ubicaciones.filter(l=>l.lat&&l.lng&&(new Date()-new Date(l.ts))<60*60*1000);
  if (!activas.length) return 'https://www.openstreetmap.org/export/embed.html?bbox=-75.65%2C6.15%2C-75.50%2C6.35&layer=mapnik';
  const lat=activas[0].lat, lng=activas[0].lng, d=0.05;
  return `https://www.openstreetmap.org/export/embed.html?bbox=${lng-d}%2C${lat-d}%2C${lng+d}%2C${lat+d}&layer=mapnik&marker=${lat}%2C${lng}`;
}

function buildNav(rol) {
  const all = [
    { page:'dashboard',     icon:'📊', label:'Dashboard',      roles:['*'] },
    { section: 'OPERACIONES' },
    { page:'recolecciones', icon:'📦', label:'Recolecciones',  roles:['superadmin','coordinador','mensajero'] },

    { page:'mensajero',     icon:'📱', label:'Vista Mensajero',roles:['superadmin','coordinador','mensajero'] },
    { section: 'CLIENTES' },
    { page:'clientes',      icon:'🏢', label:'Clientes',       roles:['superadmin','coordinador','vendedor'] },
    { page:'extintores',    icon:'🧯', label:'Extintores',     roles:['superadmin','coordinador','laboratorio','vendedor'] },
    { page:'prestamos',     icon:'🔄', label:'Préstamos',      roles:['superadmin','coordinador'] },
    { section: 'SERVICIOS' },
    { page:'laboratorio',   icon:'🔬', label:'Laboratorio',    roles:['superadmin','coordinador','laboratorio'] },
    { page:'visitas',       icon:'📋', label:'Inspecciones',   roles:['superadmin','coordinador','vendedor'] },
    { section: 'SISTEMA' },
    { page:'materiales',    icon:'🗃️', label:'Materiales',     roles:['superadmin','coordinador','laboratorio'] },
    { page:'alertas',       icon:'🔔', label:'Alertas',        roles:['*'], badge: DB.all('alertas').filter(a=>!a.leida).length },
    { page:'usuarios',      icon:'👥', label:'Usuarios',       roles:['superadmin','coordinador'] },
    { page:'auditoria',     icon:'📝', label:'Auditoría',      roles:['superadmin','coordinador'] },
    { page:'perfil',        icon:'👤', label:'Mi Perfil',      roles:['*'] },
  ];
  return all.map(item => {
    if (item.section) return `<div class="sidebar-section-label">${item.section}</div>`;
    const ok = item.roles.includes('*') || item.roles.includes(rol);
    if (!ok) return '';
    const badge = item.badge ? `<span class="nav-badge">${item.badge}</span>` : '';
    return `<div class="nav-item" data-page="${item.page}"><span class="nav-icon">${item.icon}</span>${item.label}${badge}</div>`;

}

function filterClientes(q) {
  $$('#tabla-clientes tbody tr').forEach(tr => {
    tr.style.display = tr.dataset.search.includes(q.toLowerCase()) ? '' : 'none';
  });
}

function openModalNuevoCliente() {
  $('#modal-cliente-title').textContent = 'Nuevo Cliente';
  $('#cliente-edit-id').value = '';
  ['empresa','nit','contacto','telefono','email','ciudad','direccion','lat','lng'].forEach(f => {
    const el = $(`#c-${f}`); if (el) el.value = '';
  });
  openModal('modal-cliente');
}

function editarCliente(id) {
  const c = DB.find('clientes', id);
  if (!c) return;
  $('#modal-cliente-title').textContent = 'Editar Cliente';
  $('#cliente-edit-id').value = id;
  $('#c-empresa').value    = c.empresa || '';
  $('#c-nit').value        = c.nit || '';
  $('#c-contacto').value   = c.contacto || '';
  $('#c-telefono').value   = c.telefono || '';
  $('#c-email').value      = c.email || '';
  $('#c-ciudad').value     = c.ciudad || '';
  $('#c-direccion').value  = c.direccion || '';
  $('#c-lat').value        = c.lat || '';
  $('#c-lng').value        = c.lng || '';
  openModal('modal-cliente');
}

function guardarCliente() {
  const empresa = $('#c-empresa').value.trim();
  const nit     = $('#c-nit').value.trim();
  const contacto = $('#c-contacto').value.trim();
  const telefono = $('#c-telefono').value.trim();
  if (!empresa || !nit || !contacto || !telefono) { toast('Completa los campos obligatorios','error'); return; }
  const data = {
    empresa, nit, contacto, telefono,
    email: $('#c-email').value.trim(),
    ciudad: $('#c-ciudad').value.trim(),
    direccion: $('#c-direccion').value.trim(),
    lat: parseFloat($('#c-lat').value)||0,
    lng: parseFloat($('#c-lng').value)||0,
    activo: true,
  };
  const editId = $('#cliente-edit-id').value;
  if (editId) {
    DB.updateSync('clientes', editId, data);
    toast('Cliente actualizado ✓','success');
  } else {
    DB.pushSync('clientes', data);
    toast('Cliente creado ✓','success');
  }
  // sync: {tabla:'clientes', data });
  closeModal('modal-cliente');
  logAudit(`Cliente ${data.empresa} ${editId?'actualizado':'creado'}`, 'clientes');
  navigate('clientes');
}

function verCliente(id) {
  const c = DB.find('clientes', id);
  if (!c) return;

  // Recopilar toda la info del cliente
  const exts       = DB.all('extintores').filter(e => e.clienteId === id);
  const activos    = exts.filter(e => e.estado === 'activo');
  const vencidos   = exts.filter(e => e.estado === 'vencido');
  const enLab      = exts.filter(e => e.estado === 'en_laboratorio');
  const prestados  = exts.filter(e => e.estado === 'prestado');
  const porVencer  = exts.filter(e => { const d=daysUntil(e.fechaVencimiento); return d!==null&&d>=0&&d<=60; });
  const recoleccs  = DB.all('recolecciones').filter(r => r.clienteId === id);
  const entregas   = DB.all('entregas').filter(r => r.clienteId === id);
  const visitas    = DB.all('visitas').filter(v => v.clienteId === id);
  const prestamos  = DB.all('prestamos').filter(p => p.clienteId === id);
  const labOrdenes = DB.all('laboratorio').filter(l => l.clienteId === id);

  // Timeline de eventos combinando todo
  const eventos = [
    ...recoleccs.map(r => ({ fecha: r.fechaProgramada||r.createdAt, icono:'📦', texto:`Orden de recolección — ${r.estado}`, sub: r.observaciones||'', color:'var(--blue)' })),

      </div>
      <div style="background:var(--red-l);border-radius:var(--radius-sm);padding:12px;text-align:center;border:1px solid var(--red-m);">
        <div style="font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--red);">${vencidos.length}</div>

function tabCliente(tab, id) {
  // Marcar tab activo
  $$('#tabs-cliente .tab-btn').forEach(b => b.classList.remove('active'));
  const idx = { extintores:0, historial:1, servicios:2, visitas:3 }[tab];
  const tabs = $$('#tabs-cliente .tab-btn');
  if (tabs[idx]) tabs[idx].classList.add('active');

  const d = window._clienteActual;
  if (!d) return;
  const el = $('#tab-content-cliente');
  if (!el) return;

  if (tab === 'extintores') {
    el.innerHTML = `
      <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" onclick="closeModal('modal-ver-cliente');openModalNuevoExtintorCliente('${id}')">+ Agregar extintor</button>
        <button class="btn btn-secondary btn-sm" onclick="closeModal('modal-ver-cliente');navigate('extintores')">Ver todos los extintores</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Serial</th><th>Ubicación</th><th>Tipo</th><th>Cap.</th><th>Estado</th><th>Vencimiento</th><th>Acciones</th></tr></thead>
        <tbody>${d.exts.map((e,i)=>`<tr>
          <td style="color:var(--ink-4);font-size:12px;">${i+1}</td>
          <td><strong>${e.serial}</strong></td>
          <td>${e.ubicacion}</td>
          <td>${e.tipo}</td>
          <td>${e.capacidad}</td>
          <td>${estadoExtintor(e.estado)}</td>
          <td>${vencimientoBadge(e.fechaVencimiento)}</td>
          <td>
            <div style="display:flex;gap:4px;">
              <button class="btn btn-sm btn-secondary" onclick="verHojaVida('${e.id}')">📋</button>
              <button class="btn btn-sm btn-outline" onclick="generarQR('${e.id}','${e.serial}')">📱 QR</button>
            </div>
          </td>
        </tr>`).join('')||'<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--ink-4);">Sin extintores registrados</td></tr>'}
        </tbody>
      </table></div>`;

  } else if (tab === 'historial') {
    el.innerHTML = d.eventos.length ? `
      <div class="timeline" style="margin-top:10px;">
        ${d.eventos.map(ev=>`
        <div class="timeline-item">
          <div class="timeline-dot done" style="background:${ev.color};border-color:${ev.color};"></div>
          <div class="timeline-date">${formatDate(ev.fecha)}</div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:18px;">${ev.icono}</span>
            <div>
              <div class="timeline-text" style="font-weight:500;">${ev.texto}</div>
              ${ev.sub?`<div class="timeline-user">${ev.sub}</div>`:''}
            </div>
          </div>
        </div>`).join('')}
      </div>` :
      `<div class="empty-state"><div class="empty-icon">📜</div><div class="empty-title">Sin historial aún</div><div class="empty-sub">Los eventos aparecerán aquí conforme se registren servicios</div></div>`;

  } else if (tab === 'servicios') {
    el.innerHTML = d.labOrdenes.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Extintor</th><th>Estado</th><th>Prioridad</th><th>Diagnóstico</th><th>Aprobación</th><th>Fecha</th></tr></thead>
        <tbody>${d.labOrdenes.map(l=>{
          const ext = DB.find('extintores', l.extintor);
          return `<tr>
            <td><strong>${ext?ext.serial:'—'}</strong><br><span style="font-size:11px;color:var(--ink-3);">${ext?`${ext.tipo} ${ext.capacidad}`:''}</span></td>
            <td>${estadoOrden(l.estado)}</td>
            <td>${prioridadBadge(l.prioridad)}</td>
            <td style="font-size:12px;max-width:200px;white-space:normal;">${l.diagnostico?l.diagnostico.substring(0,100)+'…':'<span style="color:var(--ink-4)">Sin diagnóstico</span>'}</td>
            <td>${l.aprobadoCliente?'<span class="badge badge-green">✓ Aprobado</span>':'<span class="badge badge-amber">Pendiente</span>'}</td>
            <td style="font-size:12px;">${formatDate(l.createdAt)}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>` :
      `<div class="empty-state"><div class="empty-icon">🔬</div><div class="empty-title">Sin órdenes de laboratorio</div></div>`;

  } else if (tab === 'visitas') {
    el.innerHTML = d.visitas.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Estado</th><th>Extintores</th><th>Observaciones</th></tr></thead>
        <tbody>${d.visitas.map(v=>`<tr>
          <td>${formatDate(v.fechaProgramada)}</td>
          <td><span class="badge ${v.tipo==='inspeccion'?'badge-blue':'badge-purple'}">${v.tipo==='inspeccion'?'Inspección':'Revisión'}</span></td>
          <td>${estadoOrden(v.estado)}</td>
          <td><span class="badge badge-blue">${(v.extintoresInspeccionados||[]).length} ext.</span></td>
          <td style="font-size:12px;max-width:200px;white-space:normal;">${v.observacionesGenerales||'—'}</td>
        </tr>`).join('')}
        </tbody>
      </table></div>` :
      `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">Sin inspecciones registradas</div></div>`;
  }
}

function abrirWaze(lat, lng) {
  if (!lat || !lng) { toast('No hay coordenadas registradas para este cliente','error'); return; }
  window.open(`https://waze.com/ul?ll=${lat},${lng}&navigate=yes`, '_blank');
}

function openModalNuevoExtintor() {
  $('#modal-ext-title').textContent = 'Nuevo Extintor';
  $('#ext-edit-id').value = '';
  ['cliente','serial','ubicacion','capacidad','libras','mmt'].forEach(f => { const e=$(`#ext-${f}`); if(e) e.value=''; });
  $('#ext-tipo').value = 'ABC';
  $('#ext-estado').value = 'activo';
  $('#ext-vencimiento').value = '';
  openModal('modal-extintor');
}

function editarExtintor(id) {
  const e = DB.find('extintores', id);
  if (!e) return;
  $('#modal-ext-title').textContent = 'Editar Extintor';
  $('#ext-edit-id').value = id;
  $('#ext-cliente').value    = e.clienteId;
  $('#ext-serial').value     = e.serial;
  $('#ext-ubicacion').value  = e.ubicacion;
  $('#ext-tipo').value       = e.tipo;
  $('#ext-capacidad').value  = e.capacidad;
  $('#ext-libras').value     = e.libras||'';
  $('#ext-mmt').value        = e.mmt||'';
  $('#ext-vencimiento').value= e.fechaVencimiento||'';
  $('#ext-estado').value     = e.estado;
  openModal('modal-extintor');
}

function guardarExtintor() {
  const clienteId = $('#ext-cliente').value;
  const serial    = $('#ext-serial').value.trim();
  const ubicacion = $('#ext-ubicacion').value.trim();
  const venc      = $('#ext-vencimiento').value;
  if (!clienteId || !serial || !ubicacion || !venc) { toast('Completa los campos obligatorios','error'); return; }
  const data = {
    clienteId, serial, ubicacion,
    tipo:             $('#ext-tipo').value,
    capacidad:        $('#ext-capacidad').value.trim(),
    libras:           $('#ext-libras').value ? parseFloat($('#ext-libras').value) : null,
    mmt:              $('#ext-mmt').value !== '' ? parseInt($('#ext-mmt').value) : null,
    fechaVencimiento: venc,
    estado:           $('#ext-estado').value,
  };
  const editId = $('#ext-edit-id').value;
  if (editId) {
    DB.updateSync('extintores', editId, data);
    toast('Extintor actualizado ✓','success');
  } else {
    DB.pushSync('extintores', data);
    toast('Extintor registrado ✓','success');
  }
  // sync: {tabla:'extintores', data });
  closeModal('modal-extintor');
  logAudit(`Extintor ${serial} ${editId?'actualizado':'creado'}`, 'extintores');
  navigate('extintores');
}

function guardarRec() {
  const clienteId = $('#rec-cliente').value;
  if (!clienteId) { toast('Selecciona un cliente','error'); return; }
  const exts = $$('input[name="rec-ext"]:checked').map(cb=>cb.value);
  const data = {
    clienteId,
    mensajeroId: $('#rec-mensajero').value,
    extintores: exts,
    prioridad:  $('#rec-prioridad').value,
    fechaProgramada: $('#rec-fecha').value,
    observaciones: $('#rec-obs').value.trim(),
    estado: 'pendiente',
  };
  DB.pushSync('recolecciones', data);
  // Crear alerta para mensajero
  DB.pushSync('alertas', { tipo:'orden', mensaje:`Nueva recolección asignada — ${clienteNombre(clienteId)}`, usuarioDestino:'mensajero', leida:false });
  // sync: {tabla:'recolecciones', data });
  toast('Orden de recolección creada ✓','success');
  closeModal('modal-rec');
  logAudit(`Orden de recolección creada — ${clienteNombre(clienteId)}`, 'recolecciones');
  navigate('recolecciones');
}

function cambiarEstadoRec(id) {
  const r = DB.find('recolecciones', id);
  if (!r) return;
  const estados = ['pendiente','en_ruta','completada','cancelada'];
  const current = estados.indexOf(r.estado);
  const next = estados[(current+1)%estados.length];
  DB.updateSync('recolecciones', id, { estado: next });
  toast(`Estado cambiado a: ${next}`,'success');
  navigate('recolecciones');
}

function verOrden(tabla, id) {
  const o = DB.find(tabla, id);
  if (!o) return;
  toast(`Orden ${id} — ${o.estado}`,'info');
}

function simularEscaneo(extId, entregaId) {
  const box = $(`#ext-scan-${extId}`);
  const check = $(`#scan-check-${extId}`);
  if (box) box.style.borderColor = 'var(--green)';
  if (check) check.textContent = '✅';
  toast(`Extintor ${extinctorSerial(extId)} escaneado ✓`,'success');
}

let isDrawing = false, lastX = 0, lastY = 0;
function iniciarFirma() {
  setTimeout(()=>{
    const canvas = $('#firma-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      if (e.touches) return { x:(e.touches[0].clientX-rect.left)*scaleX, y:(e.touches[0].clientY-rect.top)*scaleY };
      return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
    };
    canvas.addEventListener('mousedown', e=>{isDrawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;});
    canvas.addEventListener('mousemove', e=>{if(!isDrawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;});
    canvas.addEventListener('mouseup', ()=>isDrawing=false);
    canvas.addEventListener('touchstart', e=>{e.preventDefault();isDrawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;},{passive:false});
    canvas.addEventListener('touchmove', e=>{e.preventDefault();if(!isDrawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;},{passive:false});
    canvas.addEventListener('touchend', ()=>isDrawing=false);
  }, 300);
}
function limpiarFirma() { const c=$('#firma-canvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height); }

function cerrarEntrega(id) {
  const canvas = $('#firma-canvas');
  const firmaData = canvas ? canvas.toDataURL() : null;
  const correo = $('#correo-informe').value.trim();
  DB.updateSync('entregas', id, { estado:'completada', firmaCliente: firmaData, correoEnvio: correo });

}

function verDetalleEntrega(id) {

function eliminarCliente(id, nombre) {

    exts.forEach(e => DB.deleteSync('extintores', e.id));

  toast(`Estado cambiado a: ${nuevoEstado}`, 'success');
  navigate(tabla);
}

function guardarVisita() {
  const clienteId = $('#vis-cliente').value;
  if (!clienteId) { toast('Selecciona un cliente','error'); return; }
  DB.pushSync('visitas', {
    clienteId,
    tipo: $('#vis-tipo').value,
    fechaProgramada: $('#vis-fecha').value,
    vendedorId: $('#vis-vendedor').value,
    estado: 'programada',
    extintoresInspeccionados: [],
    observacionesGenerales: '',
  });
  toast('Visita programada ✓','success');
  closeModal('modal-visita');
  navigate('visitas');
}

function openModalNuevaVisita() { openModal('modal-visita'); }

function iniciarVisita(id) {
  const v = DB.find('visitas', id);
  if (!v) return;
  const c = DB.find('clientes', v.clienteId);
  let extItems = []; // Lista de extintores inspeccionados en esta sesión

  const renderExtItems = () => extItems.map((ext, idx) => `
    <div style="border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <strong style="font-family:var(--font-display);">🧯 Extintor #${idx+1}</strong>
        <button class="btn btn-sm btn-ghost" onclick="eliminarExtItem(${idx})">🗑️</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group"><label class="form-label">Ubicación</label><input class="form-control" value="${ext.ubicacion||''}" onchange="actualizarExtItem(${idx},'ubicacion',this.value)" placeholder="Recepción, Cocina..."></div>
        <div class="form-group"><label class="form-label">Tipo</label>
          <select class="form-control" onchange="actualizarExtItem(${idx},'tipo',this.value)">
            ${['ABC','CO2','Tipo K','Solkaflam','PQS'].map(t=>`<option ${ext.tipo===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label class="form-label">Capacidad</label><input class="form-control" value="${ext.capacidad||''}" onchange="actualizarExtItem(${idx},'capacidad',this.value)" placeholder="10L"></div>
        <div class="form-group"><label class="form-label">Libras</label><input class="form-control" type="number" value="${ext.libras||''}" onchange="actualizarExtItem(${idx},'libras',this.value)" placeholder="—"></div>
        <div class="form-group"><label class="form-label">MMT</label><input class="form-control" type="number" value="${ext.mmt||''}" onchange="actualizarExtItem(${idx},'mmt',this.value)" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Fecha vencimiento</label><input class="form-control" type="date" value="${ext.fechaVencimiento||''}" onchange="actualizarExtItem(${idx},'fechaVencimiento',this.value)"></div>
        <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Observaciones</label><input class="form-control" value="${ext.observaciones||''}" onchange="actualizarExtItem(${idx},'observaciones',this.value)" placeholder="Accionado, Corrosión, OK..."></div>
        <div class="form-group"><label class="form-label">Foto (opcional)</label><input class="form-control" type="file" accept="image/*" capture="environment" onchange="actualizarExtItem(${idx},'foto','[foto adjuntada]')"></div>
      </div>
    </div>`).join('');

  window._inspeccionItems = extItems;
  window._inspeccionVisitaId = id;

  $('#campo-title').textContent = `Inspección — ${c?c.empresa:''}`;
  const renderBody = () => {
    $('#campo-body').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div><strong>${c?c.empresa:''}</strong><br><span style="font-size:12px;color:var(--ink-3);">${c?c.direccion:''}</span></div>
        ${c?`<button class="btn btn-sm btn-secondary" onclick="abrirWaze(${c.lat},${c.lng})">🗺️ Waze</button>`:''}
      </div>
      <div id="ext-items-container">${renderExtItems()}</div>
      <button class="btn btn-outline" style="width:100%;justify-content:center;margin-bottom:16px;" onclick="agregarExtItem()">+ Agregar extintor</button>
      <div class="form-group"><label class="form-label">Observaciones generales de la visita</label><textarea class="form-control" id="vis-obs-general" rows="2" placeholder="Observaciones generales...">${v.observacionesGenerales||''}</textarea></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;">
        <button class="btn btn-secondary" onclick="closeModal('modal-inspeccion-campo')">Cancelar</button>
        <button class="btn btn-outline" onclick="generarInformeVisita('${id}')">📄 Vista previa informe</button>
        <button class="btn btn-primary" onclick="cerrarVisita('${id}')">✅ Finalizar y generar informe</button>
      </div>`;
  };
  window.agregarExtItem = () => { extItems.push({ubicacion:'',tipo:'ABC',capacidad:'10L',libras:null,mmt:null,fechaVencimiento:'',observaciones:'',foto:null}); renderBody(); };
  window.eliminarExtItem = (idx) => { extItems.splice(idx,1); renderBody(); };
  window.actualizarExtItem = (idx,campo,val) => { extItems[idx][campo]=val; };
  renderBody();
  openModal('modal-inspeccion-campo');
}

function cerrarVisita(id) {
  const obs = $('#vis-obs-general').value.trim();
  const exts = window._inspeccionItems || [];
  // Guardar extintores inspeccionados
  const ids = exts.map(e => { const ne = DB.pushSync('extintores', { ...e, clienteId: DB.find('visitas',id)?.clienteId||'', serial:`EXT-VIS-${genId()}`, estado:'activo' }); return ne.id; });
  DB.updateSync('visitas', id, { estado:'completada', extintoresInspeccionados:ids, observacionesGenerales:obs });
  DB.pushSync('alertas', { tipo:'visita', mensaje:`Inspección completada — ${clienteNombre(DB.find('visitas',id)?.clienteId||'')}`, usuarioDestino:'coordinador', leida:false });
  toast('Visita completada. Informe generado ✓','success');
  closeModal('modal-inspeccion-campo');
  logAudit(`Visita ${id} completada con ${ids.length} extintores`, 'visitas');
  navigate('visitas');
}

function generarOrdenDesdeVisita(id) {
  const v = DB.find('visitas', id);
  if (!v) return;
  DB.pushSync('recolecciones', { clienteId:v.clienteId, extintores:v.extintoresInspeccionados, estado:'pendiente', prioridad:'media', fechaProgramada:new Date().toISOString().split('T')[0], observaciones:`Generado desde visita ${id}`, mensajeroId:'' });
  toast('Orden de recolección creada desde la inspección ✓','success');
  navigate('recolecciones');
}

function generarInformeVisita(id) { verInforme(id); }

function cargarExtsClientePrestamo(clienteId) {
  const exts = DB.all('extintores').filter(e=>e.clienteId===clienteId&&e.estado==='activo');
  const sel = $('#pres-extintor');
  if (!sel) return;
  sel.innerHTML = exts.length ? exts.map(e=>`<option value="${e.id}">${e.serial} — ${e.tipo} ${e.capacidad}</option>`).join('')
    : '<option value="">Sin extintores disponibles para este cliente</option>';
}

function openModalNuevoPrestamo() {
  if (STATE.currentUser.rol!=='coordinador'&&STATE.currentUser.rol!=='superadmin') { toast('Solo el coordinador puede autorizar préstamos','error'); return; }
  openModal('modal-prestamo');
}

function guardarPrestamo() {
  const clienteId = $('#pres-cliente').value;
  const extintor  = $('#pres-extintor').value;
  if (!clienteId||!extintor) { toast('Completa los campos obligatorios','error'); return; }
  DB.pushSync('prestamos', { extintor, clienteId, autorizadoPor:STATE.currentUser.id, fechaPrestamo:$('#pres-fecha').value, fechaDevolucionEstimada:$('#pres-devol').value, observaciones:$('#pres-obs').value.trim(), estado:'activo' });
  DB.updateSync('extintores', extintor, { estado:'prestado' });
  toast('Préstamo registrado ✓','success');
  closeModal('modal-prestamo');
  navigate('prestamos');
}

function registrarDevolucion(id) {
  const p = DB.find('prestamos', id);
  if (!p) return;
  DB.updateSync('prestamos', id, { estado:'devuelto' });
  DB.updateSync('extintores', p.extintor, { estado:'activo' });
  toast('Devolución registrada ✓','success');
  navigate('prestamos');
}

function editarMaterial(id) {

  $('#mat-modal-title').textContent='Editar Material';$('#mat-edit-id').value=id;

// ── USUARIOS ─────────────────────────────────────

function esCoordiOAdmin() {
  return STATE.currentUser.rol === 'coordinador' || STATE.currentUser.rol === 'superadmin';
}

function rolBadge(rol) {
  const map = { superadmin:'badge-red', coordinador:'badge-purple', laboratorio:'badge-teal', mensajero:'badge-blue', vendedor:'badge-green' };
  return `<span class="badge ${map[rol]||'badge-gray'}">${rolLabel(rol)}</span>`;
}

  const usuarios   = DB.all('usuarios');
  const esCoordi   = esCoordiOAdmin();

      <div class="page-header-title">👥 Usuarios del sistema</div>

    </div>

  ${!esCoordi ? `<div class="alert alert-blue">ℹ️ Solo el coordinador puede crear usuarios y cambiar roles. Tú puedes editar tu propio nombre y contraseña desde <strong>Mi Perfil</strong>.</div>` : ''}

    <div class="table-wrap">

        <thead>
          <tr>
            <th>Usuario</th>
            <th>Correo</th>
            <th>Rol / Jerarquía</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>

            return `<tr>
              <td>

                  <div>

                    ${!esMiCuenta ? `<button class="btn btn-sm btn-ghost" onclick="toggleUsuario('${u.id}')" title="${u.activo?'Desactivar':'Activar'} usuario">${u.activo ? '🚫' : '✅'}</button>` : ''}

      <div class="modal-body">

function openModalNuevoUsuario() {
  if (!esCoordiOAdmin()) { toast('Solo el coordinador puede crear usuarios','error'); return; }
  $('#usr-title').textContent = 'Nuevo Usuario';
  $('#usr-edit-id').value = '';
  $('#usr-nombre').value  = '';
  $('#usr-email').value   = '';
  $('#usr-pass').value    = '';
  $('#usr-rol').value     = 'laboratorio';
  $('#usr-pass-hint').textContent = '(requerida para nuevo usuario)';
  $('#usr-resumen').style.display = 'none';
  openModal('modal-usuario');
}

function abrirEdicionUsuario(id) {
  if (!esCoordiOAdmin()) { toast('Sin permisos para editar usuarios','error'); return; }
  const u = DB.find('usuarios', id);
  if (!u) return;
  $('#usr-title').textContent = `Editar — ${u.nombre}`;
  $('#usr-edit-id').value = id;
  $('#usr-nombre').value  = u.nombre;
  $('#usr-email').value   = u.email;
  $('#usr-pass').value    = '';
  $('#usr-rol').value     = u.rol;
  $('#usr-pass-hint').textContent = '(dejar en blanco para no cambiar)';
  const resumen = $('#usr-resumen');
  resumen.style.display = 'block';
  resumen.innerHTML = `👤 Editando cuenta de <strong>${u.nombre}</strong> · Rol actual: ${rolLabel(u.rol)}`;
  openModal('modal-usuario');
}

function guardarUsuario() {
  if (!esCoordiOAdmin()) { toast('Sin permisos','error'); return; }
  const nombre  = $('#usr-nombre').value.trim();
  const email   = $('#usr-email').value.trim();
  const pass    = $('#usr-pass').value;
  const rol     = $('#usr-rol').value;
  const editId  = $('#usr-edit-id').value;

  if (!nombre || !email) { toast('Nombre y correo son obligatorios','error'); return; }
  if (!editId && !pass)  { toast('La contraseña es obligatoria para usuarios nuevos','error'); return; }

  const data = { nombre, email, rol, activo: true };
  if (pass) data.password = pass;

  if (editId) {
    DB.updateSync('usuarios', editId, data);
    logAudit(`Usuario ${nombre} actualizado (rol: ${rol})`, 'usuarios');
    toast(`Usuario ${nombre} actualizado ✓`, 'success');
  } else {
    DB.pushSync('usuarios', data);
    logAudit(`Usuario ${nombre} creado (rol: ${rol})`, 'usuarios');
    toast(`Usuario ${nombre} creado ✓`, 'success');
  }

  // sync: {tabla:'usuarios', data });
  closeModal('modal-usuario');
  navigate('usuarios');
}

function toggleUsuario(id) {
  if (!esCoordiOAdmin()) { toast('Solo el coordinador puede activar o desactivar usuarios','error'); return; }
  const u = DB.find('usuarios', id);
  if (!u) return;
  if (u.id === STATE.currentUser.id) { toast('No puedes desactivar tu propia cuenta','error'); return; }
  DB.updateSync('usuarios', id, { activo: !u.activo });
  logAudit(`Usuario ${u.nombre} ${!u.activo?'activado':'desactivado'}`, 'usuarios');
  toast(`Usuario ${u.nombre} ${!u.activo ? 'activado' : 'desactivado'} ✓`, 'success');
  navigate('usuarios');
}

// ── PERFIL (cualquier usuario edita solo lo suyo) ────────────
// REGLAS:
//   ✅ Cualquier usuario puede cambiar su propio nombre
//   ✅ Cualquier usuario puede cambiar su propia contraseña
//   ❌ Nadie puede cambiar su propio rol desde aquí (solo el coordinador lo hace desde Usuarios)

function renderPerfil(el) {
  const u = STATE.currentUser;
  el.innerHTML = `
  <div class="page-header">
    <div class="page-header-left">
      <div class="page-header-title">👤 Mi Perfil</div>
      <div class="page-header-sub">Edita tu nombre y contraseña</div>
    </div>
  </div>

  <div style="max-width:480px;">
    <div class="card" style="margin-bottom:16px;">
      <div class="card-body">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:26px;flex-shrink:0;">${u.nombre[0]}</div>
          <div>
            <div style="font-family:var(--font-display);font-weight:700;font-size:20px;">${u.nombre}</div>
            <div style="color:var(--ink-3);font-size:13px;">${u.email}</div>
            <div style="margin-top:6px;">${rolBadge(u.rol)}</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Nombre completo <span class="required">*</span></label>
          <input class="form-control" id="perf-nombre" value="${u.nombre}" placeholder="Tu nombre completo">
        </div>

        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input class="form-control" value="${u.email}" disabled style="background:var(--surface);color:var(--ink-3);cursor:not-allowed;">
          <div class="form-hint">El correo solo lo puede cambiar el coordinador.</div>
        </div>

        <div style="border-top:1px solid var(--border);margin:16px 0 14px;"></div>
        <div style="font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:12px;">🔒 Cambiar contraseña</div>

        <div class="form-group">
          <label class="form-label">Contraseña actual <span class="required">*</span></label>
          <input class="form-control" id="perf-pass-actual" type="password" placeholder="Tu contraseña actual">
        </div>

        <div class="form-group">
          <label class="form-label">Nueva contraseña</label>
          <input class="form-control" id="perf-pass-nueva" type="password" placeholder="Dejar en blanco para no cambiar">
        </div>

        <div class="form-group">
          <label class="form-label">Confirmar nueva contraseña</label>
          <input class="form-control" id="perf-pass-conf" type="password" placeholder="Repetir nueva contraseña">
        </div>

        <div class="alert alert-blue" style="font-size:12.5px;">
          🔐 Tu rol actual es <strong>${rolLabel(u.rol)}</strong>. Solo el coordinador puede cambiar el rol asignado.
        </div>

        <div style="display:flex;gap:10px;margin-top:6px;">
          <button class="btn btn-primary" onclick="guardarPerfil()">💾 Guardar cambios</button>
          <button class="btn btn-secondary" onclick="navigate('dashboard')">Cancelar</button>
        </div>
      </div>
    </div>
  </div>`;
}

function guardarPerfil() {
  const nombre     = $('#perf-nombre').value.trim();
  const passActual = $('#perf-pass-actual').value;
  const passNueva  = $('#perf-pass-nueva').value;
  const passConf   = $('#perf-pass-conf').value;

  if (!nombre) { toast('El nombre no puede estar vacío','error'); return; }

  // Verificar contraseña actual siempre
  const userEnDB = DB.find('usuarios', STATE.currentUser.id);
  if (!passActual) { toast('Debes ingresar tu contraseña actual para guardar cambios','error'); return; }
  if (userEnDB.password !== passActual) { toast('La contraseña actual es incorrecta','error'); return; }

  // Si quiere cambiar contraseña, validar coincidencia
  if (passNueva) {
    if (passNueva.length < 6) { toast('La nueva contraseña debe tener al menos 6 caracteres','error'); return; }
    if (passNueva !== passConf) { toast('Las contraseñas nuevas no coinciden','error'); return; }
  }

  const data = { nombre };
  if (passNueva) data.password = passNueva;

  DB.updateSync('usuarios', STATE.currentUser.id, data);
  STATE.currentUser = { ...STATE.currentUser, ...data };
  DB.set('sessionUser', STATE.currentUser);
  // sync: {tabla:'usuarios', data: { id: STATE.currentUser.id, ...data } });
  logAudit('Perfil actualizado', 'perfil');
  toast('Perfil actualizado correctamente ✓', 'success');

  // Limpiar campos de contraseña
  ['perf-pass-actual','perf-pass-nueva','perf-pass-conf'].forEach(id => { const e=$(`#${id}`); if(e) e.value=''; });
}


// ── ELIMINAR LABORATORIO / MATERIALES / USUARIOS ─
function eliminarOrdenLab(id) {
  confirmarSuperadmin(`Eliminar orden de laboratorio: ${id}`, () => {
    const o = DB.find('laboratorio', id);
    if (o) {
      DB.updateSync('extintores', o.extintor, { estado: 'activo' });
    }
    DB.deleteSync('laboratorio', id);
    logAudit(`Orden de laboratorio ${id} eliminada`, 'laboratorio');
    toast('Orden de laboratorio eliminada', 'success');
    navigate('laboratorio');
  });
}

function eliminarMaterial(id, nombre) {
  confirmarSuperadmin(`Eliminar material: ${nombre}`, () => {
    DB.deleteSync('materiales', id);
    logAudit(`Material ${nombre} eliminado`, 'materiales');
    toast(`Material ${nombre} eliminado`, 'success');
    navigate('materiales');
  });
}

function eliminarUsuarioAdmin(id) {
  const u = DB.find('usuarios', id);
  if (!u) return;
  if (u.id === STATE.currentUser.id) { toast('No puedes eliminarte a ti mismo', 'error'); return; }
  confirmarSuperadmin(`Eliminar usuario: ${u.nombre}`, () => {
    DB.deleteSync('usuarios', id);
    logAudit(`Usuario ${u.nombre} eliminado`, 'usuarios');
    toast(`Usuario ${u.nombre} eliminado`, 'success');
    navigate('usuarios');
  });
}
