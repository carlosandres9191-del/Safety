<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safety CRM — Extintores Safety</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f4f4f4;color:#111;}
:root{--red:#c8281e;--green:#16a34a;--amber:#d97706;--blue:#1d4ed8;--border:#e5e5e5;--white:#fff;--surface:#f9f9f9;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-thumb{background:#ccc;border-radius:99px;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;padding:20px;}
.login-box{background:#fff;border-radius:14px;padding:36px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.4);}
.login-logo{width:60px;height:60px;background:var(--red);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;margin:0 auto 14px;}
.login-title{text-align:center;font-size:20px;font-weight:800;margin-bottom:3px;}
.login-sub{text-align:center;font-size:12px;color:#888;margin-bottom:24px;}
.login-err{background:#fdf0ef;color:#b91c1c;border:1px solid #fca5a5;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
.app{display:flex;min-height:100vh;}
#sidebar{width:240px;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;overflow-y:auto;transition:transform .25s;}
#sidebar.hidden{transform:translateX(-100%);}
#main{margin-left:240px;flex:1;min-height:100vh;transition:margin .25s;}
#main.full{margin-left:0;}
.s-logo{padding:16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
.s-logo-icon{width:36px;height:36px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0;}
.s-user{margin:10px;background:rgba(255,255,255,.07);border-radius:8px;padding:10px;display:flex;align-items:center;gap:8px;}
.s-av{width:30px;height:30px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.s-sec{padding:10px 16px 3px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:13px;color:rgba(255,255,255,.6);cursor:pointer;border-left:3px solid transparent;transition:all .15s;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.05);}
.nav-item.active{color:#fff;border-left-color:var(--red);background:rgba(200,40,30,.15);font-weight:600;}
.nav-icon{width:18px;text-align:center;font-size:14px;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px;}
.s-bottom{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.08);}
.s-sync{background:rgba(255,255,255,.07);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
.s-sync-lbl{font-size:9px;color:rgba(255,255,255,.35);margin-bottom:3px;}
.s-sync-st{font-size:11px;font-weight:600;color:#16a34a;margin-bottom:5px;}
.s-sync-btns{display:flex;gap:4px;}
.s-sync-btns button{flex:1;background:rgba(255,255,255,.1);color:#fff;border-radius:5px;padding:5px 3px;font-size:10px;font-weight:500;}
#topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;position:sticky;top:0;z-index:100;}
.topbar-title{font-weight:700;font-size:15px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.o-dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
.o-dot.off{background:var(--amber);}
#page{padding:22px;max-width:1400px;}
.card{background:#fff;border-radius:12px;border:1px solid var(--border);margin-bottom:14px;overflow:hidden;}
.card-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.card-title{font-weight:700;font-size:14px;}
.card-body{padding:16px 18px;}
.card-actions{margin-left:auto;display:flex;gap:6px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.stat{background:#fff;border-radius:12px;border:1px solid var(--border);padding:14px 16px;cursor:pointer;transition:box-shadow .15s;}
.stat:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);}
.stat-val{font-size:28px;font-weight:800;line-height:1;}
.stat-lbl{font-size:11px;color:#888;margin-top:4px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--red);color:#fff;} .btn-primary:hover{background:#a01f17;}
.btn-secondary{background:var(--surface);color:#444;border:1px solid var(--border);} .btn-secondary:hover{background:#eee;}
.btn-outline{background:transparent;color:var(--red);border:1.5px solid var(--red);} .btn-outline:hover{background:#fdf0ef;}
.btn-ghost{background:transparent;color:#888;} .btn-ghost:hover{background:var(--surface);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{background:#fee2e2;color:#b91c1c;} .btn-danger:hover{background:#fca5a5;}
.btn-green{background:var(--green);color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:12px;font-weight:600;color:#333;margin-bottom:4px;}
.req{color:var(--red);margin-left:2px;}
.fc{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13.5px;outline:none;transition:border .15s;background:#fff;}
.fc:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,40,30,.08);}
.fc::placeholder{color:#bbb;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hint{font-size:11px;color:#888;margin-top:3px;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;}
.badge-green{background:#dcfce7;color:#15803d;} .badge-red{background:#fdf0ef;color:#b91c1c;}
.badge-amber{background:#fef3c7;color:#92400e;} .badge-blue{background:#dbeafe;color:#1e40af;}
.badge-purple{background:#ede9fe;color:#6d28d9;} .badge-gray{background:#f3f4f6;color:#6b7280;}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#888;padding:8px 12px;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;} tr:hover td{background:#fafafa;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateY(14px);transition:transform .22s;}
.overlay.open .modal{transform:translateY(0);}
.modal.sm{max-width:420px;} .modal.lg{max-width:860px;}
.m-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.m-title{font-weight:700;font-size:15px;}
.m-close{margin-left:auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#888;}
.m-close:hover{background:var(--surface);}
.m-body{padding:18px 20px;}
.m-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.alert{padding:9px 13px;border-radius:8px;font-size:13px;display:flex;align-items:flex-start;gap:7px;margin-bottom:12px;}
.alert-red{background:#fdf0ef;color:#b91c1c;border:1px solid #fca5a5;}
.alert-blue{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;}
.alert-amber{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
.alert-green{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.ph-title{font-weight:800;font-size:21px;}
.ph-sub{font-size:13px;color:#888;margin-top:2px;}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;}
.empty{text-align:center;padding:48px 20px;color:#888;}
.empty-icon{font-size:42px;opacity:.4;margin-bottom:10px;}
.empty-title{font-weight:700;font-size:16px;color:#555;margin-bottom:4px;}
.tl{padding-left:20px;position:relative;}
.tl::before{content:'';position:absolute;left:6px;top:4px;bottom:0;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:14px;}
.tl-dot{position:absolute;left:-17px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--red);}
.tl-dot.done{background:var(--green);border-color:var(--green);}
.tl-date{font-size:10px;color:#888;margin-bottom:2px;}
.tl-text{font-size:13px;}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:7px;z-index:9000;}
.toast{background:#1a1a1a;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:7px;min-width:220px;animation:tin .25s;}
.toast.success{border-left:4px solid var(--green);} .toast.error{border-left:4px solid var(--red);} .toast.info{border-left:4px solid var(--blue);}
@keyframes tin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
#offline{position:fixed;top:0;left:0;right:0;background:var(--amber);color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:500;z-index:9999;transform:translateY(-100%);transition:transform .3s;}
#offline.show{transform:translateY(0);}
@media(max-width:768px){#sidebar{width:240px;transform:translateX(-100%);} #sidebar.mob{transform:translateX(0)!important;} #main{margin-left:0!important;} #page{padding:12px;} .fgrid{grid-template-columns:1fr;} .stats{grid-template-columns:1fr 1fr;} .ph{flex-direction:column;}}
</style>
</head>
<body>
<div id="offline">⚠️ Sin conexión — modo local</div>
<div id="toasts"></div>
<div id="app"></div>
<script>
var SB_URL = 'https://ilivtsacimtffnaxgtwx.supabase.co';
var SB_KEY = 'sb_publishable_RBFJ8i1X9wO2F402TSUFiw_bUH8Ui0T';
var SB_H = {apikey:SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
var APP = {user:null,page:'dashboard',timer:null,gps:null};

// SUPABASE
async function sbGet(t,q) {
  q = q||'';
  try {
    var r = await fetch(SB_URL+'/rest/v1/'+t+'?select=*'+q, {headers:SB_H});
    if(r.ok) return await r.json();
  } catch(e) { console.warn('sbGet',t,e.message); }
  return null;
}
async function sbSave(t,data) {
  try {
    var h = Object.assign({},SB_H,{'Prefer':'resolution=merge-duplicates,return=representation'});
    var r = await fetch(SB_URL+'/rest/v1/'+t, {method:'POST',headers:h,body:JSON.stringify(data)});
    if(r.ok) return await r.json();
    console.warn('sbSave',t,r.status, await r.text());
  } catch(e) { console.warn('sbSave',e.message); }
  return null;
}
async function sbDel(t,id) {
  try {
    var r = await fetch(SB_URL+'/rest/v1/'+t+'?id=eq.'+id, {method:'DELETE',headers:SB_H});
    return r.ok;
  } catch(e) { return false; }
}

// CACHE LOCAL
var C = {
  get: function(k) { try{return JSON.parse(localStorage.getItem('x_'+k)||'null')}catch{return null} },
  set: function(k,v) { try{localStorage.setItem('x_'+k,JSON.stringify(v))}catch{} },
  all: function(k) { return this.get(k)||[] },
  find: function(k,id) { return this.all(k).find(function(x){return x.id===id}) }
};

// DB: Supabase primario + cache local
var DB = {
  all:  function(t) { return C.all(t) },
  find: function(t,id) { return C.find(t,id) },
  save: function(t,item) {
    item.id = item.id || uid();
    item.created_at = item.created_at || ts();
    var a = C.all(t);
    var i = a.findIndex(function(x){return x.id===item.id});
    if(i>=0) a[i]=Object.assign({},a[i],item); else a.push(item);
    C.set(t,a);
    sbSave(t,item).then(function(r){ if(!r) Q.add('u',t,item); else syncSt(); });
    return item;
  },
  del: function(t,id) {
    C.set(t, C.all(t).filter(function(x){return x.id!==id}));
    sbDel(t,id).then(function(ok){ if(!ok) Q.add('d',t,{id:id}); else syncSt(); });
  }
};

// QUEUE OFFLINE
var Q = {
  get: function() { return JSON.parse(localStorage.getItem('pq')||'[]') },
  set: function(a) { localStorage.setItem('pq',JSON.stringify(a)) },
  add: function(op,t,data) { var q=this.get(); q.push({op:op,t:t,data:data}); this.set(q); syncSt(); }
};

function syncSt() {
  var n = Q.get().length;
  var el = document.getElementById('sync-st');
  if(el) { el.textContent = n>0 ? '⏳ '+n+' pend.' : '✓ Sincronizado'; el.style.color = n>0?'#d97706':'#16a34a'; }
}

async function syncNow() {
  var q = Q.get(); if(!q.length) { syncSt(); return; }
  var fail = [];
  for(var i=0;i<q.length;i++) {
    var item = q[i];
    try {
      var ok = item.op==='u' ? await sbSave(item.t,item.data) : await sbDel(item.t,item.data.id);
      if(!ok && item.op==='u') fail.push(item);
    } catch(e) { fail.push(item); }
  }
  Q.set(fail); syncSt();
  if(q.length-fail.length>0) toast((q.length-fail.length)+' sincronizados ✓','success');
}

async function refreshAll() {
  var tablas = ['clientes','extintores','recolecciones','entregas','laboratorio','materiales','visitas','alertas','prestamos','auditoria','usuarios'];
  var n = 0;
  for(var i=0;i<tablas.length;i++) {
    var d = await sbGet(tablas[i]);
    if(Array.isArray(d)) { C.set(tablas[i],d); n++; }
  }
  syncSt();
  if(n>0) { toast('Datos actualizados ✓','success'); if(APP.page) renderPage(APP.page); }
}

// UTILS
function uid() { return Date.now().toString(36)+Math.random().toString(36).substr(2,5) }
function ts()  { return new Date().toISOString() }
function fD(iso)  { if(!iso)return'—'; return new Date(iso).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) }
function fDT(iso) { if(!iso)return'—'; return new Date(iso).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) }
function dTo(iso) { if(!iso)return null; return Math.ceil((new Date(iso)-new Date())/864e5) }
function vB(f) { var d=dTo(f); if(d===null)return''; if(d<0)return'<span class="badge badge-red">Vencido</span>'; if(d<=30)return'<span class="badge badge-amber">Vence '+d+'d</span>'; if(d<=90)return'<span class="badge badge-blue">Vence '+d+'d</span>'; return'<span class="badge badge-green">Vigente</span>'; }
function eB(e) { var m={activo:['green','Activo'],en_laboratorio:['purple','En lab'],prestado:['amber','Prestado'],vencido:['red','Vencido'],en_ruta:['blue','En ruta']}; var x=m[e]||['gray',e]; return'<span class="badge badge-'+x[0]+'">'+x[1]+'</span>'; }
function oB(e) { var m={pendiente:['amber','Pendiente'],en_ruta:['blue','En ruta'],completada:['green','Completada'],cancelada:['gray','Cancelada'],diagnostico:['purple','Diagnóstico'],en_proceso:['blue','En proceso'],programada:['blue','Programada'],completado:['green','Completado']}; var x=m[e]||['gray',e]; return'<span class="badge badge-'+x[0]+'">'+x[1]+'</span>'; }
function pB(p) { var m={alta:'red',media:'amber',baja:'green'}; return'<span class="badge badge-'+(m[p]||'gray')+'">'+p+'</span>'; }
function rL(r) { return {superadmin:'Superadmin',coordinador:'Coordinador',laboratorio:'Laboratorio',mensajero:'Mensajero',vendedor:'Vendedor'}[r]||r }
function cN(id) { var c=DB.find('clientes',id); return c?c.empresa:'—' }
function eS(id) { var e=DB.find('extintores',id); return e?e.serial:id }
function el(id) { return document.getElementById(id) }
function qs(s,ctx) { return (ctx||document).querySelector(s) }
function qsa(s,ctx) { return Array.from((ctx||document).querySelectorAll(s)) }
function isCoord() { return APP.user && (APP.user.rol==='coordinador'||APP.user.rol==='superadmin') }
function can(pg) {
  if(!APP.user) return false;
  var p = {superadmin:['*'],coordinador:['dashboard','clientes','extintores','recolecciones','entregas','laboratorio','visitas','prestamos','alertas','materiales','auditoria','usuarios','mantenimiento','mapa','perfil'],laboratorio:['dashboard','extintores','laboratorio','materiales','alertas','perfil'],mensajero:['dashboard','recolecciones','entregas','mensajero','alertas','perfil'],vendedor:['dashboard','clientes','extintores','visitas','alertas','perfil']}[APP.user.rol]||[];
  return p.includes('*')||p.includes(pg);
}

function toast(msg,type) {
  type = type||'info';
  var icons = {success:'✅',error:'❌',info:'ℹ️'};
  var d = document.createElement('div'); d.className='toast '+type;
  d.innerHTML = '<span>'+icons[type]+'</span><span>'+msg+'</span>';
  var c = el('toasts'); if(c) c.appendChild(d);
  setTimeout(function(){d.remove()},3500);
}

function openM(id) { var m=el(id); if(m) m.classList.add('open') }
function closeM(id) { var m=el(id); if(m) m.classList.remove('open') }
function logA(ac,mod) { if(!APP.user)return; DB.save('auditoria',{usuarioId:APP.user.id,accion:ac,modulo:mod}) }

function confirmSA(msg,cb) {
  var ov = document.createElement('div');
  ov.className = 'overlay open'; ov.style.zIndex = '9999';
  ov.innerHTML = '<div class="modal sm"><div class="m-head"><span class="m-title">🔐 Acción protegida</span></div><div class="m-body"><div class="alert alert-red" style="margin-bottom:14px;">⚠️ '+msg+'</div><div class="fg"><label>Correo superadmin</label><input class="fc" id="_sae" type="email"></div><div class="fg"><label>Contraseña</label><input class="fc" id="_sap" type="password"></div><div id="_saerr" style="color:red;font-size:12px;display:none;">❌ Credenciales incorrectas</div></div><div class="m-foot"><button class="btn btn-secondary" id="_sac">Cancelar</button><button class="btn btn-primary" style="background:red;" id="_saok">Confirmar</button></div></div>';
  document.body.appendChild(ov);
  el('_sac').onclick = function(){ ov.remove() };
  el('_saok').onclick = async function() {
    var email = el('_sae').value.trim().toLowerCase();
    var pass  = el('_sap').value.trim();
    var lista = await sbGet('usuarios','&rol=eq.superadmin') || DB.all('usuarios').filter(function(u){return u.rol==='superadmin'});
    var ok = lista.find(function(u){ return (u.email||'').toLowerCase()===email && String(u.password||u.contrasena||'').trim()===pass });
    if(!ok) { el('_saerr').style.display='block'; return; }
    ov.remove(); cb();
  };
  setTimeout(function(){ var p=el('_sap'); if(p) p.focus() },100);
}

// AUTH
async function doLogin() {
  var email = (el('l_em').value||'').trim().toLowerCase();
  var pass  = (el('l_pw').value||'').trim();
  var btn   = el('l_btn');
  var errEl = el('l_err');
  errEl.style.display = 'none';
  if(!email||!pass) { errEl.textContent='Ingresa correo y contraseña'; errEl.style.display='block'; return; }
  btn.textContent = 'Verificando...'; btn.disabled = true;
  try {
    var lista = await sbGet('usuarios');
    if(!lista) { errEl.textContent='Error de conexión. Verifica tu internet.'; errEl.style.display='block'; btn.textContent='Ingresar →'; btn.disabled=false; return; }
    C.set('usuarios',lista);
    var user = null;
    for(var i=0;i<lista.length;i++) {
      var u = lista[i];
      var eOk = (u.email||'').trim().toLowerCase() === email;
      var pOk = String(u.password||u.contrasena||'').trim() === pass;
      var aOk = u.activo===true || u.activo==='true' || u.activo===1;
      if(eOk && pOk && aOk) { user=u; break; }
    }
    if(user) {
      APP.user = user; C.set('session',user);
      logA('Login','auth');
      await refreshAll();
      showApp();
    } else {
      errEl.textContent = 'Correo o contraseña incorrectos';
      errEl.style.display = 'block';
      btn.textContent = 'Ingresar →'; btn.disabled = false;
    }
  } catch(e) {
    console.error('Login:',e);
    errEl.textContent = 'Error: '+e.message;
    errEl.style.display = 'block';
    btn.textContent = 'Ingresar →'; btn.disabled = false;
  }
}

function logout() {
  if(APP.timer) clearInterval(APP.timer);
  if(APP.gps) navigator.geolocation.clearWatch(APP.gps);
  APP = {user:null,page:'dashboard',timer:null,gps:null};

function toggleSB() {

function goTo(pg) {
  APP.page = pg;

function renderPage(pg) {
  var c = el('page'); if(!c) return;

function onlineCheck() {
  var b=el('offline'),d=el('o-dot'),t=el('o-txt');
  if(!b) return;
  if(!navigator.onLine) { b.classList.add('show'); if(d)d.className='o-dot off'; if(t)t.textContent='Sin conexión'; }
  else { b.classList.remove('show'); if(d)d.className='o-dot'; if(t)t.textContent='En línea'; syncNow(); }
}

function startGPS() {
  if(!navigator.geolocation) return;
  APP.gps = navigator.geolocation.watchPosition(async function(pos) {
    var loc = {id:APP.user.id,usuarioId:APP.user.id,nombre:APP.user.nombre,lat:pos.coords.latitude,lng:pos.coords.longitude,ts:ts(),activo:true};

    await sbSave('ubicaciones', loc);
  }, function(e){ console.warn('GPS:',e.message) }, {enableHighAccuracy:true,maximumAge:10000,timeout:15000});
  toast('📍 GPS activado','info');
}

var _iD=false,_lx=0,_ly=0;
function initFirma() {
  var cv=el('firma-cv'); if(!cv) return;
  var ctx=cv.getContext('2d'); ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.lineCap='round';
  function pos(e) { var r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height; return e.touches?{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy}:{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy} }
  cv.onmousedown=function(e){_iD=true;var p=pos(e);_lx=p.x;_ly=p.y};
  cv.onmousemove=function(e){if(!_iD)return;var p=pos(e);ctx.beginPath();ctx.moveTo(_lx,_ly);ctx.lineTo(p.x,p.y);ctx.stroke();_lx=p.x;_ly=p.y};
  cv.onmouseup=function(){_iD=false};
  cv.addEventListener('touchstart',function(e){e.preventDefault();_iD=true;var p=pos(e);_lx=p.x;_ly=p.y},{passive:false});
  cv.addEventListener('touchmove',function(e){e.preventDefault();if(!_iD)return;var p=pos(e);ctx.beginPath();ctx.moveTo(_lx,_ly);ctx.lineTo(p.x,p.y);ctx.stroke();_lx=p.x;_ly=p.y},{passive:false});
  cv.addEventListener('touchend',function(){_iD=false});
}

    +'<div style="display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start;">'
    +'<div class="card"><div class="card-head"><span class="card-title">Mensajeros</span></div><div>'
    +(mens.length?mens.map(function(u){var loc=ubs.find(function(l){return(l.usuarioId||l.id)===u.id});var mins=loc?Math.floor((now2-new Date(loc.ts))/60000):null;var ac=mins!==null&&mins<30;return'<div style="padding:12px 14px;border-bottom:1px solid #e5e5e5;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><div style="width:10px;height:10px;border-radius:50%;background:'+(ac?'var(--green)':'#e5e5e5')+';flex-shrink:0;"></div><div><div style="font-weight:600;">'+u.nombre+'</div><div style="font-size:11px;color:#888;">'+(ac?'Activo hace '+mins+' min':'Sin ubicación')+'</div></div></div>'+(loc&&ac?'<div style="display:flex;gap:5px;"><button class="btn btn-sm btn-secondary" onclick="centrarMapa('+loc.lat+','+loc.lng+')">📍</button><button class="btn btn-sm btn-secondary" onclick="window.open('https://waze.com/ul?ll='+loc.lat+','+loc.lng+'&navigate=yes','_blank')">🗺️</button></div>':'')+'</div>';}).join(''):'<div style="padding:20px;text-align:center;color:#888;">Sin mensajeros</div>')+'</div></div>'
    +'<div class="card"><div class="card-head"><span class="card-title">Mapa</span></div><iframe id="mapa-if" src="'+mapaUrl()+'" style="width:100%;height:500px;border:none;" loading="lazy"></iframe></div>'
    +'</div>'
    +'<div class="alert alert-blue" style="margin-top:12px;">ℹ️ GPS se activa automáticamente cuando el mensajero inicia sesión. Verde = activo últimos 30 min.</div>';
}
function centrarMapa(lat,lng){var d=0.015,f=el('mapa-if');if(f)f.src='https://www.openstreetmap.org/export/embed.html?bbox='+(lng-d)+'%2C'+(lat-d)+'%2C'+(lng+d)+'%2C'+(lat+d)+'&layer=mapnik&marker='+lat+'%2C'+lng;}

// AUDITORÍA
function pgAud(c) {
  var lg=DB.all('auditoria').slice().reverse();

    +'</tbody></table></div></div>';

// USUARIOS
function pgUsr(c) {
  var us=DB.all('usuarios');
  var rc={superadmin:'badge-red',coordinador:'badge-purple',laboratorio:'badge-blue',mensajero:'badge-amber',vendedor:'badge-green'};
  c.innerHTML='<div class="ph"><div><div class="ph-title">👥 Usuarios</div><div class="ph-sub">'+us.filter(function(u){return u.activo}).length+' activos</div></div><div class="ph-actions">'+(isCoord()?'<button class="btn btn-primary" onclick="mUsr()">+ Nuevo</button>':'')+'</div></div>'
    +'<div class="card"><div class="tw"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'
    +us.map(function(u){var esYo=u.id===APP.user.id;return'<tr><td><div style="display:flex;align-items:center;gap:8px;"><div style="width:28px;height:28px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;">'+u.nombre[0]+'</div><div><strong>'+u.nombre+'</strong>'+(esYo?' <small style="color:#888">(yo)</small>':'')+'</div></div></td><td>'+(u.email||'')+'</td><td><span class="badge '+(rc[u.rol]||'badge-gray')+'">'+rL(u.rol)+'</span></td><td>'+(u.activo?'<span class="badge badge-green">Activo</span>':'<span class="badge badge-gray">Inactivo</span>')+'</td><td><div style="display:flex;gap:4px;">'+(isCoord()?'<button class="btn btn-sm btn-outline" onclick="mUsr(''+u.id+'')">✏️</button>':'')+(isCoord()&&!esYo?'<button class="btn btn-sm btn-ghost" onclick="togUsr(''+u.id+'')">'+(u.activo?'🚫':'✅')+'</button><button class="btn btn-sm btn-danger" onclick="delUsr(''+u.id+'',''+u.nombre.replace(/'/g,'')+'')">🗑️</button>':'')+'</div></td></tr>'}).join('')
    +'</tbody></table></div></div>'
    +'<div class="overlay" id="m-usr"><div class="modal sm"><div class="m-head"><span class="m-title" id="m-usr-t">Usuario</span><button class="m-close btn" onclick="closeM('m-usr')">✕</button></div><div class="m-body"><input type="hidden" id="usr-id"><div class="fg"><label>Nombre <span class="req">*</span></label><input class="fc" id="usr-nom"></div><div class="fg"><label>Correo <span class="req">*</span></label><input class="fc" id="usr-em" type="email"></div><div class="fg"><label>Contraseña <span id="usr-ph" style="font-weight:400;color:#888;">(requerida)</span></label><input class="fc" id="usr-pw" type="password"></div><div class="fg"><label>Rol</label><select class="fc" id="usr-rol"><option value="coordinador">Coordinador</option><option value="laboratorio">Laboratorio</option><option value="mensajero">Mensajero</option><option value="vendedor">Vendedor</option><option value="superadmin">Superadmin</option></select><div class="hint">Solo coordinador puede cambiar jerarquías</div></div></div><div class="m-foot"><button class="btn btn-secondary" onclick="closeM('m-usr')">Cancelar</button><button class="btn btn-primary" onclick="saveUsr()">💾 Guardar</button></div></div></div>';
}
function mUsr(id){if(!isCoord()){toast('Sin permisos','error');return;}id=id||'';el('m-usr-t').textContent=id?'Editar':'Nuevo Usuario';el('usr-id').value=id;var u=id?DB.find('usuarios',id):{};el('usr-nom').value=u.nombre||'';el('usr-em').value=u.email||'';el('usr-pw').value='';el('usr-rol').value=u.rol||'laboratorio';el('usr-ph').textContent=id?'(dejar en blanco para no cambiar)':'(requerida)';openM('m-usr');}
function saveUsr(){if(!isCoord()){toast('Sin permisos','error');return;}var nom=(el('usr-nom').value||'').trim(),em=(el('usr-em').value||'').trim(),pw=(el('usr-pw').value||'').trim(),rol=el('usr-rol').value,id=el('usr-id').value;if(!nom||!em){toast('Nombre y correo obligatorios','error');return;}if(!id&&!pw){toast('Contraseña obligatoria','error');return;}var data={nombre:nom,email:em,rol:rol,activo:true};if(pw)data.password=pw;if(id)data.id=id;DB.save('usuarios',data);toast(id?'Actualizado ✓':'Creado ✓','success');closeM('m-usr');goTo('usuarios');}
function togUsr(id){if(!isCoord()){toast('Sin permisos','error');return;}var u=DB.find('usuarios',id);if(u){DB.save('usuarios',Object.assign({},u,{activo:!u.activo}));goTo('usuarios');}}
function delUsr(id,n){if(!isCoord()){toast('Sin permisos','error');return;}confirmSA('Eliminar usuario: '+n,function(){DB.del('usuarios',id);toast('Eliminado','success');goTo('usuarios')})}

// MANTENIMIENTO
function pgMant(c) {
  var n=Q.get().length;
  c.innerHTML='<div class="ph"><div><div class="ph-title">⚙️ Mantenimiento</div></div></div>'
    +'<div class="card" style="margin-bottom:14px;"><div class="card-head"><span class="card-title">☁️ Sincronización</span></div><div class="card-body"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;"><div style="background:var(--surface);border-radius:8px;padding:11px 16px;text-align:center;"><div style="font-size:26px;font-weight:800;color:'+(n>0?'var(--amber)':'var(--green)')+'">'+n+'</div><div style="font-size:11px;color:#888;">Pendientes</div></div><div style="background:var(--surface);border-radius:8px;padding:11px 16px;text-align:center;"><div style="font-size:22px;">'+(navigator.onLine?'🟢':'🔴')+'</div><div style="font-size:11px;color:#888;">'+(navigator.onLine?'Conectado':'Sin conexión')+'</div></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-primary" onclick="syncNow().then(function(){pgMant(el('page'))})">☁️ Sincronizar</button><button class="btn btn-secondary" onclick="refreshAll()">🔄 Recargar</button></div></div></div>'
    +'<div class="card" style="border-color:#fca5a5;"><div class="card-head" style="background:#fdf0ef;"><span class="card-title" style="color:#b91c1c;">🗑️ Zona de peligro</span></div><div class="card-body"><div class="alert alert-red">⚠️ Estas acciones son irreversibles y requieren contraseña Superadmin.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;"><div style="border:1px solid #e5e5e5;border-radius:10px;padding:12px;"><div style="font-weight:600;margin-bottom:6px;">🧯 Extintores</div><button class="btn btn-sm btn-danger" onclick="delAll('extintores')">Borrar</button></div><div style="border:1px solid #e5e5e5;border-radius:10px;padding:12px;"><div style="font-weight:600;margin-bottom:6px;">🏢 Clientes</div><button class="btn btn-sm btn-danger" onclick="delAll('clientes')">Borrar</button></div><div style="border:1px solid #e5e5e5;border-radius:10px;padding:12px;"><div style="font-weight:600;margin-bottom:6px;">📦 Órdenes</div><button class="btn btn-sm btn-danger" onclick="delOrd()">Borrar</button></div><div style="border:1px solid #e5e5e5;border-radius:10px;padding:12px;"><div style="font-weight:600;margin-bottom:6px;">📝 Auditoría</div><button class="btn btn-sm btn-danger" onclick="delAll('auditoria')">Borrar</button></div></div><div style="border:2px solid #ef4444;border-radius:10px;padding:14px;margin-top:12px;background:#fef2f2;"><div style="font-weight:700;color:#b91c1c;margin-bottom:6px;">💥 Borrar TODO</div><button class="btn btn-primary" style="background:#ef4444;" onclick="delTodo()">💥 Borrar todo</button></div></div></div>';
}
async function delAll(t){confirmSA('Borrar tabla: '+t,async function(){await fetch(SB_URL+'/rest/v1/'+t+'?id=neq.NADA',{method:'DELETE',headers:SB_H});C.set(t,[]);toast('Borrado ✓','success');pgMant(el('page'));})}
async function delOrd(){confirmSA('Borrar todas las órdenes',async function(){for(var t of ['recolecciones','entregas','laboratorio','visitas','prestamos']){await fetch(SB_URL+'/rest/v1/'+t+'?id=neq.NADA',{method:'DELETE',headers:SB_H});C.set(t,[]);}toast('Borrado ✓','success');pgMant(el('page'));})}
async function delTodo(){confirmSA('BORRAR ABSOLUTAMENTE TODO',async function(){for(var t of ['clientes','extintores','recolecciones','entregas','laboratorio','visitas','prestamos','alertas','auditoria','materiales']){await fetch(SB_URL+'/rest/v1/'+t+'?id=neq.NADA',{method:'DELETE',headers:SB_H});C.set(t,[]);}Q.set([]);toast('Borrado. Recargando...','info');setTimeout(function(){location.reload()},1500);})}

// PERFIL
function pgPerfil(c) {
  var u=APP.user;
  var rc={superadmin:'badge-red',coordinador:'badge-purple',laboratorio:'badge-blue',mensajero:'badge-amber',vendedor:'badge-green'};
  c.innerHTML='<div class="ph"><div><div class="ph-title">👤 Mi Perfil</div></div></div>'
    +'<div style="max-width:460px;"><div class="card"><div class="card-body">'
    +'<div style="display:flex;align-items:center;gap:13px;margin-bottom:18px;padding-bottom:15px;border-bottom:1px solid #e5e5e5;"><div style="width:56px;height:56px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;">'+u.nombre[0]+'</div><div><div style="font-weight:700;font-size:17px;">'+u.nombre+'</div><div style="color:#888;font-size:12px;">'+u.email+'</div><span class="badge '+(rc[u.rol]||'badge-gray')+'" style="margin-top:5px;">'+rL(u.rol)+'</span></div></div>'
    +'<div class="fg"><label>Nombre <span class="req">*</span></label><input class="fc" id="pf-nom" value="'+u.nombre+'"></div>'
    +'<div style="border-top:1px solid #e5e5e5;margin:12px 0;"></div>'
    +'<div style="font-weight:600;margin-bottom:10px;">🔒 Cambiar contraseña</div>'
    +'<div class="fg"><label>Contraseña actual <span class="req">*</span></label><input class="fc" id="pf-act" type="password"></div>'
    +'<div class="fg"><label>Nueva contraseña</label><input class="fc" id="pf-new" type="password" placeholder="Dejar en blanco para no cambiar"></div>'
    +'<div class="fg"><label>Confirmar nueva</label><input class="fc" id="pf-conf" type="password"></div>'
    +'<div class="alert alert-blue">🔐 Rol: <strong>'+rL(u.rol)+'</strong>. Solo el coordinador puede cambiar jerarquías.</div>'
    +'<div style="display:flex;gap:8px;margin-top:8px;"><button class="btn btn-primary" onclick="savePf()">💾 Guardar</button><button class="btn btn-secondary" onclick="goTo('dashboard')">Cancelar</button></div>'
    +'</div></div></div>';
}
function savePf(){
  var nom=(el('pf-nom').value||'').trim();
  var act=(el('pf-act').value||'').trim();
  var nw=(el('pf-new').value||'').trim();
  var cf=(el('pf-conf').value||'').trim();
  if(!nom){toast('Nombre vacío','error');return;}
  if(!act){toast('Ingresa contraseña actual','error');return;}
  var u=APP.user;
  var pwOk=String(u.password||u.contrasena||'').trim()===act;
  if(!pwOk){toast('Contraseña actual incorrecta','error');return;}
  if(nw&&nw.length<6){toast('Mínimo 6 caracteres','error');return;}
  if(nw&&nw!==cf){toast('No coinciden','error');return;}
  var data=Object.assign({},u,{nombre:nom});
  if(nw)data.password=nw;
  DB.save('usuarios',data);
  APP.user=data; C.set('session',data);
  toast('Actualizado ✓','success');
  ['pf-act','pf-new','pf-conf'].forEach(function(id){var e=el(id);if(e)e.value=''});
}

// INIT
(function(){
  Object.keys(localStorage).forEach(function(k){if(k.startsWith('safety_')||k.startsWith('scrm_'))localStorage.removeItem(k)});
  ['clientes','extintores','recolecciones','entregas','laboratorio','materiales','visitas','alertas','prestamos','auditoria','usuarios'].forEach(function(t){if(!C.get(t))C.set(t,[])});
  var s=C.get('session');
  if(s&&s.id){
    APP.user=s;
    refreshAll().then(function(){showApp()});
  } else {
    showLogin();
  }
})();
</script>
