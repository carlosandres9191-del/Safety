<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#fff;border-radius:16px;padding:36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.logo{width:60px;height:60px;background:#c8281e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;margin:0 auto 14px;}
h1{text-align:center;font-size:20px;margin-bottom:4px;}
.sub{text-align:center;font-size:12px;color:#888;margin-bottom:24px;}
label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#333;}
input{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;margin-bottom:14px;outline:none;}
input:focus{border-color:#c8281e;}
button{width:100%;padding:12px;background:#c8281e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
button:hover{background:#a01f17;}
button:disabled{background:#ccc;cursor:not-allowed;}
.err{background:#fdf0ef;color:#b91c1c;border:1px solid #fca5a5;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">S</div>
  <h1>Extintores Safety</h1>
  <div class="sub">Sistema de Gestión CRM</div>
  <label>Correo electrónico</label>
  <input type="email" id="em" placeholder="correo@empresa.com">
  <label>Contraseña</label>
  <input type="password" id="pw" placeholder="••••••••">
  <div class="err" id="err">Correo o contraseña incorrectos</div>
  <button id="btn" onclick="entrar()">Ingresar →</button>
</div>

<script>
const SB_URL = 'https://ilivtsacimtffnaxgtwx.supabase.co';
const SB_KEY = 'sb_publishable_RBFJ8i1X9wO2F402TSUFiw_bUH8Ui0T';

document.getElementById('pw').addEventListener('keydown', function(e){
  if(e.key === 'Enter') entrar();
});

async function entrar() {
  var email = document.getElementById('em').value.trim().toLowerCase();
  var pass  = document.getElementById('pw').value.trim();
  var btn   = document.getElementById('btn');
  var err   = document.getElementById('err');

  err.style.display = 'none';

  if(!email || !pass) {
    err.textContent = 'Ingresa correo y contraseña';
    err.style.display = 'block';
    return;
  }

  btn.textContent = 'Verificando...';
  btn.disabled = true;

  try {
    var resp = await fetch(SB_URL + '/rest/v1/usuarios?select=*', {
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY
      }
    });

    if (!resp.ok) {
      throw new Error('HTTP ' + resp.status);
    }

    var usuarios = await resp.json();

    var user = null;
    for (var i = 0; i < usuarios.length; i++) {
      var u = usuarios[i];
      var emailOk = (u.email || '').trim().toLowerCase() === email;
      var passOk  = String(u.password || u.contrasena || '').trim() === pass;
      var activo  = u.activo === true || u.activo === 'true' || u.activo === 1;
      if (emailOk && passOk && activo) {
        user = u;
        break;
      }
    }

    if (user) {
      localStorage.setItem('session', JSON.stringify(user));
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
      window.location.href = 'dashboard.html';
    } else {
      err.textContent = 'Correo o contraseña incorrectos';
      err.style.display = 'block';
      btn.textContent = 'Ingresar →';
      btn.disabled = false;
    }

  } catch(e) {
    console.error('Error:', e);
    err.textContent = 'Error de conexión: ' + e.message;
    err.style.display = 'block';
    btn.textContent = 'Ingresar →';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
