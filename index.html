<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safety CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e;-webkit-font-smoothing:antialiased}
:root{
  --red:#e63946;--red-d:#c1121f;--red-l:#fff0f0;
  --green:#2d6a4f;--green-l:#d8f3dc;
  --amber:#e76f51;--amber-l:#fff3e0;
  --blue:#1d3557;--blue-l:#e8f4f8;
  --purple:#7209b7;--purple-l:#f3e8ff;
  --border:#e8eaf0;--surface:#f8f9fc;
  --white:#ffffff;--ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#9090a0;
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#d0d0e0;border-radius:99px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}

/* LAYOUT */
.shell{display:flex;min-height:100vh}
#sb{width:260px;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;overflow-y:auto;transition:transform .3s}
#sb.hide{transform:translateX(-100%)}
#main{margin-left:260px;flex:1;min-height:100vh;transition:margin .3s}
#main.full{margin-left:0}

/* SIDEBAR */
.sb-brand{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{display:flex;align-items:center;gap:12px}
.sb-icon{width:40px;height:40px;background:var(--red);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(230,57,70,.4)}
.sb-name{font-weight:700;font-size:14px;letter-spacing:-.3px}
.sb-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px}
.sb-user{margin:16px 12px 8px;background:rgba(255,255,255,.07);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.sb-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--amber));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.sb-uname{font-size:13px;font-weight:600}
.sb-urole{font-size:10px;color:rgba(255,255,255,.45);margin-top:1px}
.sb-sec{padding:16px 20px 6px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.25)}
.ni{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;border-left:3px solid transparent;transition:all .2s;margin:1px 0}
.ni:hover{color:#fff;background:rgba(255,255,255,.06)}
.ni.on{color:#fff;border-left-color:var(--red);background:rgba(230,57,70,.12);font-weight:600}
.ni-ic{width:20px;text-align:center;font-size:15px;flex-shrink:0}
.ni-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px}
.sb-foot{margin-top:auto;padding:16px 12px;border-top:1px solid rgba(255,255,255,.08)}
.sb-sync{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.sb-sync-lbl{font-size:9px;color:rgba(255,255,255,.3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.sb-sync-st{font-size:12px;font-weight:600;color:#2d6a4f;margin-bottom:8px}
.sb-sync-btns{display:flex;gap:6px}
.sb-sync-btns button{flex:1;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border-radius:7px;padding:6px 4px;font-size:10px;font-weight:600;transition:background .2s}
.sb-sync-btns button:hover{background:rgba(255,255,255,.18)}

/* TOPBAR */
#tb{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.tb-title{font-weight:700;font-size:16px;color:var(--ink)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.odot{width:8px;height:8px;border-radius:50%;background:#2d6a4f;box-shadow:0 0 0 3px #d8f3dc}
.odot.off{background:var(--amber);box-shadow:0 0 0 3px var(--amber-l)}

/* PAGE */
#pg{padding:28px;max-width:1440px}

/* CARDS */
.card{background:#fff;border-radius:14px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ch{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.ct{font-weight:700;font-size:14px;color:var(--ink)}
.cb{padding:20px}
.ca{margin-left:auto;display:flex;gap:8px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border-radius:14px;border:1px solid var(--border);padding:18px 20px;cursor:pointer;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.stat-val{font-size:32px;font-weight:800;line-height:1;letter-spacing:-1px}
.stat-lbl{font-size:11px;color:var(--ink3);margin-top:6px;font-weight:500}
.stat-icon{font-size:20px;margin-bottom:8px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:-.2px}
.btn-pr{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(230,57,70,.3)}
.btn-pr:hover{background:var(--red-d);transform:translateY(-1px);box-shadow:0 6px 16px rgba(230,57,70,.4)}
.btn-se{background:var(--surface);color:var(--ink2);border:1.5px solid var(--border)}
.btn-se:hover{background:#eef0f6}
.btn-ou{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn-ou:hover{background:var(--red-l)}
.btn-gh{background:transparent;color:var(--ink3)}
.btn-gh:hover{background:var(--surface);color:var(--ink)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-da{background:#fde8e8;color:#c1121f;border:1px solid #f9c0c0}
.btn-da:hover{background:#f9c0c0}
.btn-gr{background:var(--green-l);color:var(--green);border:1px solid #b7e4c7}
.btn-gr:hover{background:#b7e4c7}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* FORM */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.req{color:var(--red);margin-left:2px}
.fc{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;outline:none;transition:all .2s;background:#fff;color:var(--ink)}
.fc:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,57,70,.08)}
.fc::placeholder{color:#c0c0d0}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:11px;color:var(--ink3);margin-top:4px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.bg{background:var(--green-l);color:var(--green)}
.br{background:var(--red-l);color:var(--red-d)}
.ba{background:var(--amber-l);color:#8d4d00}
.bb{background:var(--blue-l);color:var(--blue)}
.bp{background:var(--purple-l);color:var(--purple)}
.bgr{background:#f0f0f5;color:var(--ink3)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:10px 14px;border-bottom:2px solid var(--border);white-space:nowrap;background:#fafbfc}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbff}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(10,10,30,.5);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:18px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.2);transform:translateY(20px);transition:transform .25s}
.ov.open .modal{transform:translateY(0)}
.modal.sm{max-width:440px}
.modal.lg{max-width:880px}
.mh{padding:22px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.mt{font-weight:700;font-size:16px}
.mc{margin-left:auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:18px}
.mc:hover{background:var(--surface)}
.mb{padding:22px 24px}
.mf{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fafbfc}

/* ALERTS */
.al{padding:11px 14px;border-radius:10px;font-size:13px;display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
.al-r{background:var(--red-l);color:var(--red-d);border:1px solid #f9c0c0}
.al-b{background:var(--blue-l);color:var(--blue);border:1px solid #b8d8e8}
.al-a{background:var(--amber-l);color:#8d4d00;border:1px solid #f4c08a}
.al-g{background:var(--green-l);color:var(--green);border:1px solid #b7e4c7}

/* PAGE HEADER */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.ph-t{font-weight:800;font-size:24px;letter-spacing:-.5px}
.ph-s{font-size:13px;color:var(--ink3);margin-top:3px}
.ph-a{display:flex;gap:10px;flex-wrap:wrap}

/* MISC */
.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-ic{font-size:48px;opacity:.3;margin-bottom:14px}
.empty-t{font-weight:700;font-size:18px;color:var(--ink2);margin-bottom:6px}
.tl{padding-left:22px;position:relative}
.tl::before{content:'';position:absolute;left:7px;top:4px;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-18px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--red)}
.tl-dot.done{background:var(--green);border-color:var(--green)}
.tl-date{font-size:10px;color:var(--ink3);margin-bottom:2px}
.tl-text{font-size:13px}

/* TOAST */
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9000}
.toast{background:#1a1a2e;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:9px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .3s}
.toast.success{border-left:4px solid var(--green)}
.toast.error{border-left:4px solid var(--red)}
.toast.info{border-left:4px solid var(--blue)}
@keyframes tin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* OFFLINE */
#offline{position:fixed;top:0;left:0;right:0;background:var(--amber);color:#fff;text-align:center;padding:7px;font-size:12px;font-weight:600;z-index:9999;transform:translateY(-100%);transition:transform .3s}
#offline.show{transform:translateY(0)}

/* LOGIN */
#login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,.4)}
.login-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--red),var(--amber));border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff;margin:0 auto 18px;box-shadow:0 8px 24px rgba(230,57,70,.4)}
.login-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.login-sub{text-align:center;font-size:12px;color:var(--ink3);margin-bottom:28px}
.login-err{background:var(--red-l);color:var(--red-d);border:1px solid #f9c0c0;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}

@media(max-width:768px){
  #sb{width:260px;transform:translateX(-100%)}
  #sb.mob{transform:translateX(0)!important}
  #main{margin-left:0!important}
  #pg{padding:14px}
  .fg2,.fg3{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .ph{flex-direction:column}
}
@media(max-width:480px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="offline">⚠️ Sin conexión — modo local activo</div>
<div id="toasts"></div>
<div id="app"></div>
<script>
const SBURL = 'https://ilivtsacimtffnaxgtwx.supabase.co';
const SBKEY = 'sb_publishable_RBFJ8i1X9wO2F402TSUFiw_bUH8Ui0T';
const SBH = {'apikey':SBKEY,'Authorization':'Bearer '+SBKEY,'Content-Type':'application/json','Prefer':'return=representation'};
let APP = {user:null,page:'dashboard',timer:null,gps:null};

// ── SUPABASE ───────────────────────────────────────────────────────────
async function sbGet(t,q) {
  q = q||'';
  try {
    const r = await fetch(`${SBURL}/rest/v1/${t}?select=*${q}`,{headers:SBH});
    if(r.ok) return await r.json();
  } catch(e) { console.warn('sbGet',t,e.message); }
  return null;
}
async function sbSave(t,data) {
  try {
    const h = {...SBH,'Prefer':'resolution=merge-duplicates,return=representation'};
    const r = await fetch(`${SBURL}/rest/v1/${t}`,{method:'POST',headers:h,body:JSON.stringify(data)});
    if(r.ok) return await r.json();
    console.warn('sbSave',t,r.status,await r.text());
  } catch(e) { console.warn('sbSave',e.message); }
  return null;
}
async function sbDel(t,id) {
  try {
    const r = await fetch(`${SBURL}/rest/v1/${t}?id=eq.${id}`,{method:'DELETE',headers:SBH});
    return r.ok;
  } catch(e) { return false; }
}

// ── CACHE LOCAL ────────────────────────────────────────────────────────
const C = {
  get(k){ try{return JSON.parse(localStorage.getItem('x_'+k)||'null')}catch{return null} },
  set(k,v){ try{localStorage.setItem('x_'+k,JSON.stringify(v))}catch{} },
  all(k){ return this.get(k)||[] },
  find(k,id){ return this.all(k).find(x=>x.id===id) }
};

// ── DB ─────────────────────────────────────────────────────────────────
const DB = {
  all(t){ return C.all(t) },
  find(t,id){ return C.find(t,id) },
  save(t,item){
    item.id = item.id || uid();
    item.created_at = item.created_at || ts();
    const a = C.all(t);
    const i = a.findIndex(x=>x.id===item.id);
    if(i>=0) a[i]={...a[i],...item}; else a.push(item);
    C.set(t,a);
    sbSave(t,item).then(r=>{ if(!r) Q.add('u',t,item); else syncSt(); });
    return item;
  },
  del(t,id){
    C.set(t,C.all(t).filter(x=>x.id!==id));
    sbDel(t,id).then(ok=>{ if(!ok) Q.add('d',t,{id}); else syncSt(); });
  }
};

// ── QUEUE ──────────────────────────────────────────────────────────────
const Q = {
  get(){ return JSON.parse(localStorage.getItem('pq')||'[]') },
  set(a){ localStorage.setItem('pq',JSON.stringify(a)) },
  add(op,t,data){ const q=this.get(); q.push({op,t,data}); this.set(q); syncSt(); }
};

function syncSt() {
  const n = Q.get().length;
  const el = ge('sync-st');
  if(el){ el.textContent=n>0?`⏳ ${n} pendientes`:'✓ Sincronizado'; el.style.color=n>0?'#e76f51':'#52b788'; }
}

async function syncNow() {
  const q = Q.get(); if(!q.length){ syncSt(); return; }
  const fail = [];
  for(const item of q){
    try {
      const ok = item.op==='u' ? await sbSave(item.t,item.data) : await sbDel(item.t,item.data.id);
      if(!ok && item.op==='u') fail.push(item);
    } catch(e){ fail.push(item); }
  }
  Q.set(fail); syncSt();
  if(q.length-fail.length>0) toast(`${q.length-fail.length} registros sincronizados ✓`,'success');
}

async function refreshAll() {
  const tablas = ['clientes','extintores','recolecciones','entregas','laboratorio','materiales','visitas','alertas','prestamos','auditoria','usuarios'];
  let n = 0;
  for(const t of tablas){
    const d = await sbGet(t);
    if(Array.isArray(d)){ C.set(t,d); n++; }
  }
  syncSt();
  if(n>0){ toast('Datos actualizados ✓','success'); if(APP.page) renderPage(APP.page); }
}

// ── UTILS ──────────────────────────────────────────────────────────────
function uid(){ return Date.now().toString(36)+Math.random().toString(36).substr(2,5) }
function ts(){ return new Date().toISOString() }
function fD(iso){ if(!iso)return'—'; return new Date(iso).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) }
function fDT(iso){ if(!iso)return'—'; return new Date(iso).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) }
function dTo(iso){ if(!iso)return null; return Math.ceil((new Date(iso)-new Date())/864e5) }
function vB(f){ const d=dTo(f); if(d===null)return''; if(d<0)return'<span class="badge br">Vencido</span>'; if(d<=30)return`<span class="badge ba">Vence ${d}d</span>`; if(d<=90)return`<span class="badge bb">Vence ${d}d</span>`; return'<span class="badge bg">Vigente</span>'; }
function eB(e){ const m={activo:['bg','Activo'],en_laboratorio:['bp','En lab'],prestado:['ba','Prestado'],vencido:['br','Vencido'],en_ruta:['bb','En ruta']}; const[c,l]=m[e]||['bgr',e]; return `<span class="badge ${c}">${l}</span>`; }
function oB(e){ const m={pendiente:['ba','Pendiente'],en_ruta:['bb','En ruta'],completada:['bg','Completada'],cancelada:['bgr','Cancelada'],diagnostico:['bp','Diagnóstico'],en_proceso:['bb','En proceso'],programada:['bb','Programada'],completado:['bg','Completado']}; const[c,l]=m[e]||['bgr',e]; return `<span class="badge ${c}">${l}</span>`; }
function pB(p){ const m={alta:'br',media:'ba',baja:'bg'}; return `<span class="badge ${m[p]||'bgr'}">${p||''}</span>`; }
function rL(r){ return {superadmin:'Superadmin',coordinador:'Coordinador',laboratorio:'Laboratorio',mensajero:'Mensajero',vendedor:'Vendedor'}[r]||r }
function cN(id){ const c=DB.find('clientes',id); return c?c.empresa:'—' }
function eS(id){ const e=DB.find('extintores',id); return e?e.serial:id }
function ge(id){ return document.getElementById(id) }
function qs(s,ctx){ return (ctx||document).querySelector(s) }
function qsa(s,ctx){ return [...(ctx||document).querySelectorAll(s)] }
function isC(){ return APP.user&&(APP.user.rol==='coordinador'||APP.user.rol==='superadmin') }
function can(pg){
  if(!APP.user) return false;
  const p={superadmin:['*'],coordinador:['dashboard','clientes','extintores','recolecciones','entregas','laboratorio','visitas','prestamos','alertas','materiales','auditoria','usuarios','mantenimiento','mapa','perfil'],laboratorio:['dashboard','extintores','laboratorio','materiales','alertas','perfil'],mensajero:['dashboard','recolecciones','entregas','mensajero','alertas','perfil'],vendedor:['dashboard','clientes','extintores','visitas','alertas','perfil']}[APP.user.rol]||[];
  return p.includes('*')||p.includes(pg);
}

function toast(msg,type='info'){
  const icons={success:'✅',error:'❌',info:'ℹ️'};
  const d=document.createElement('div'); d.className=`toast ${type}`;
  d.innerHTML=`<span>${icons[type]}</span><span>${msg}</span>`;
  ge('toasts').appendChild(d); setTimeout(()=>d.remove(),3500);
}
function openM(id){ const m=ge(id); if(m)m.classList.add('open') }
function closeM(id){ const m=ge(id); if(m)m.classList.remove('open') }
function logA(ac,mod){ if(!APP.user)return; DB.save('auditoria',{usuarioId:APP.user.id,accion:ac,modulo:mod}) }

function confirmSA(msg,cb){
  const ov=document.createElement('div'); ov.className='ov open'; ov.style.zIndex='9999';
  ov.innerHTML=`<div class="modal sm"><div class="mh"><span class="mt">🔐 Acción protegida</span></div><div class="mb"><div class="al al-r" style="margin-bottom:14px;">⚠️ ${msg}</div><div class="fg"><label>Correo superadmin</label><input class="fc" id="_sae" type="email" placeholder="admin@empresa.com"></div><div class="fg"><label>Contraseña</label><input class="fc" id="_sap" type="password" placeholder="••••••••"></div><div id="_serr" style="color:var(--red);font-size:12px;display:none;">❌ Credenciales incorrectas</div></div><div class="mf"><button class="btn btn-se" id="_sc">Cancelar</button><button class="btn btn-pr" style="background:var(--red-d);" id="_sok">Confirmar</button></div></div>`;
  document.body.appendChild(ov);
  ge('_sc').onclick = ()=>ov.remove();
  ge('_sok').onclick = async()=>{
    const email=ge('_sae').value.trim().toLowerCase(), pass=ge('_sap').value.trim();
    const lista=await sbGet('usuarios','&rol=eq.superadmin')||DB.all('usuarios').filter(u=>u.rol==='superadmin');
    const ok=lista.find(u=>(u.email||'').toLowerCase()===email&&String(u.password||u.contrasena||'').trim()===pass);
    if(!ok){ ge('_serr').style.display='block'; return; }
    ov.remove(); cb();
  };
  setTimeout(()=>ge('_sap')&&ge('_sap').focus(),100);
}

// ── AUTH ───────────────────────────────────────────────────────────────
async function doLogin(){
  const email=(ge('l_em').value||'').trim().toLowerCase();
  const pass=(ge('l_pw').value||'').trim();
  const btn=ge('l_btn'), errEl=ge('l_err');
  errEl.style.display='none';
  if(!email||!pass){ errEl.textContent='Ingresa correo y contraseña'; errEl.style.display='block'; return; }
  btn.textContent='Verificando...'; btn.disabled=true;
  try {
    const lista=await sbGet('usuarios');
    if(!lista){ errEl.textContent='Error de conexión. Verifica tu internet.'; errEl.style.display='block'; btn.textContent='Ingresar →'; btn.disabled=false; return; }
    C.set('usuarios',lista);
    const user=lista.find(u=>{
      const eOk=(u.email||'').trim().toLowerCase()===email;
      const pOk=String(u.password||u.contrasena||'').trim()===pass;
      const aOk=u.activo===true||u.activo==='true'||u.activo===1;
      return eOk&&pOk&&aOk;
    });
    if(user){ APP.user=user; C.set('session',user); logA('Login','auth'); await refreshAll(); showApp(); }
    else { errEl.textContent='Correo o contraseña incorrectos'; errEl.style.display='block'; btn.textContent='Ingresar →'; btn.disabled=false; }
  } catch(e){
    console.error('Login:',e);
    errEl.textContent='Error: '+e.message; errEl.style.display='block';
    btn.textContent='Ingresar →'; btn.disabled=false;
  }
}

function logout(){
  if(APP.timer) clearInterval(APP.timer);
  if(APP.gps) navigator.geolocation.clearWatch(APP.gps);
  APP={user:null,page:'dashboard',timer:null,gps:null}; C.set('session',null); showLogin();
}

function showLogin(){
  ge('app').innerHTML=`<div id="login-wrap"><div class="login-card"><div class="login-logo">S</div><div class="login-title">Extintores Safety</div><div class="login-sub">Sistema de Gestión CRM</div><div class="fg"><label>Correo electrónico</label><input class="fc" id="l_em" type="email" placeholder="correo@empresa.com" autocomplete="email"></div><div class="fg"><label>Contraseña</label><input class="fc" id="l_pw" type="password" placeholder="••••••••" autocomplete="current-password"></div><div class="login-err" id="l_err"></div><button class="btn btn-pr" id="l_btn" style="width:100%;justify-content:center;padding:13px;font-size:14px;margin-top:6px;">Ingresar →</button></div></div>`;
  ge('l_btn').addEventListener('click',doLogin);
  ge('l_pw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin() });
  onlineCheck();
}

function showApp(){
  const u=APP.user;
  const an=DB.all('alertas').filter(a=>!a.leida).length;
  const pn=Q.get().length;
  ge('app').innerHTML=`<div class="shell"><aside id="sb">${buildSB(u,pn)}</aside><main id="main"><div id="tb"><button onclick="toggleSB()" class="btn btn-gh btn-sm">☰</button><span id="tb-t" class="tb-title">Dashboard</span><div class="tb-right"><div class="odot" id="odot"></div><span id="otxt" style="font-size:12px;color:var(--ink3);">En línea</span><button class="btn btn-se btn-sm" onclick="goTo('alertas')">🔔 <span class="ni-badge" style="position:static;">${an}</span></button></div></div><div id="pg"></div></main></div>`;
  qsa('.ni[data-pg]').forEach(n=>n.addEventListener('click',()=>goTo(n.dataset.pg)));
  window.addEventListener('online',onlineCheck);

  APP.timer=setInterval(()=>{ if(navigator.onLine) syncNow() },30000);

}

function buildSB(u,pn){
  const items=[

    {sec:'OPERACIONES'},
    {pg:'recolecciones',ic:'📦',lb:'Recolecciones',r:['superadmin','coordinador','mensajero']},
    {pg:'entregas',ic:'🚚',lb:'Entregas',r:['superadmin','coordinador','mensajero']},
    {pg:'mensajero',ic:'📱',lb:'Vista Mensajero',r:['superadmin','coordinador','mensajero']},
    {pg:'mapa',ic:'🗺️',lb:'Mapa Mensajeros',r:['superadmin','coordinador']},
    {sec:'CLIENTES'},
    {pg:'clientes',ic:'🏢',lb:'Clientes',r:['superadmin','coordinador','vendedor']},
    {pg:'extintores',ic:'🧯',lb:'Extintores',r:['superadmin','coordinador','laboratorio','vendedor']},
    {pg:'prestamos',ic:'🔄',lb:'Préstamos',r:['superadmin','coordinador']},
    {sec:'SERVICIOS'},
    {pg:'laboratorio',ic:'🔬',lb:'Laboratorio',r:['superadmin','coordinador','laboratorio']},
    {pg:'visitas',ic:'📋',lb:'Inspecciones',r:['superadmin','coordinador','vendedor']},
    {sec:'SISTEMA'},
    {pg:'materiales',ic:'🗃️',lb:'Materiales',r:['superadmin','coordinador','laboratorio']},
    {pg:'alertas',ic:'🔔',lb:'Alertas',r:['*'],badge:DB.all('alertas').filter(a=>!a.leida).length},
    {pg:'usuarios',ic:'👥',lb:'Usuarios',r:['superadmin','coordinador']},
    {pg:'auditoria',ic:'📝',lb:'Auditoría',r:['superadmin','coordinador']},
    {pg:'mantenimiento',ic:'⚙️',lb:'Mantenimiento',r:['superadmin','coordinador']},
    {pg:'perfil',ic:'👤',lb:'Mi Perfil',r:['*']},
  ];
  const nav=items.map(i=>{
    if(i.sec) return `<div class="sb-sec">${i.sec}</div>`;
    const ok=i.r.includes('*')||i.r.includes(u.rol); if(!ok) return '';
    const b=i.badge?`<span class="ni-badge">${i.badge}</span>`:'';
    return `<div class="ni" data-pg="${i.pg}"><span class="ni-ic">${i.ic}</span>${i.lb}${b}</div>`;
  }).join('');
  return `<div class="sb-brand"><div class="sb-logo"><div class="sb-icon">S</div><div><div class="sb-name">Safety CRM</div><div class="sb-sub">Extintores Safety S.A.S</div></div></div></div><div class="sb-user"><div class="sb-av">${u.nombre[0]}</div><div><div class="sb-uname">${u.nombre}</div><div class="sb-urole">${rL(u.rol)}</div></div></div><nav>${nav}</nav><div class="sb-foot"><div class="sb-sync"><div class="sb-sync-lbl">Base de datos</div><div class="sb-sync-st" id="sync-st">${pn>0?'⏳ '+pn+' pendientes':'✓ Sincronizado'}</div><div class="sb-sync-btns"><button onclick="syncNow()">☁️ Sync</button><button onclick="refreshAll()">🔄 Actualizar</button></div></div><div class="ni" style="border-radius:10px;" onclick="logout()"><span class="ni-ic">🚪</span>Cerrar sesión</div></div>`;
}

function toggleSB(){
  const s=ge('sb'),m=ge('main');
  if(window.innerWidth<=768) s.classList.toggle('mob');
  else { s.classList.toggle('hide'); m.classList.toggle('full'); }
}

function goTo(pg){
  APP.page=pg;
  qsa('.ni[data-pg]').forEach(n=>n.classList.toggle('on',n.dataset.pg===pg));
  const titles={dashboard:'📊 Dashboard',clientes:'🏢 Clientes',extintores:'🧯 Extintores',recolecciones:'📦 Recolecciones',entregas:'🚚 Entregas',laboratorio:'🔬 Laboratorio',visitas:'📋 Inspecciones',prestamos:'🔄 Préstamos',alertas:'🔔 Alertas',materiales:'🗃️ Materiales',mensajero:'📱 Vista Mensajero',mapa:'🗺️ Mapa Mensajeros',auditoria:'📝 Auditoría',usuarios:'👥 Usuarios',mantenimiento:'⚙️ Mantenimiento',perfil:'👤 Mi Perfil'};
  const t=ge('tb-t'); if(t) t.textContent=titles[pg]||pg;
  renderPage(pg);
  if(window.innerWidth<=768){ ge('sb').classList.remove('mob'); }
}

function renderPage(pg){
  const c=ge('pg'); if(!c)return;
  if(!can(pg)){ c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">Sin acceso</div></div>'; return; }
  const map={dashboard:pgDash,clientes:pgCl,extintores:pgExt,recolecciones:pgRec,entregas:pgEnt,laboratorio:pgLab,visitas:pgVis,prestamos:pgPres,alertas:pgAl,materiales:pgMat,mensajero:pgMens,mapa:pgMapa,auditoria:pgAud,usuarios:pgUsr,mantenimiento:pgMant,perfil:pgPerfil};
  if(map[pg]) map[pg](c);
  else c.innerHTML='<div class="empty"><div class="empty-ic">🚧</div><div class="empty-t">En construcción</div></div>';
}

function onlineCheck(){
  const b=ge('offline'),d=ge('odot'),t=ge('otxt');
  if(!b)return;
  if(!navigator.onLine){ b.classList.add('show'); if(d)d.className='odot off'; if(t)t.textContent='Sin conexión'; }
  else{ b.classList.remove('show'); if(d)d.className='odot'; if(t)t.textContent='En línea'; syncNow(); }
}

function startGPS(){
  if(!navigator.geolocation)return;
  APP.gps=navigator.geolocation.watchPosition(async pos=>{
    const loc={id:APP.user.id,usuarioId:APP.user.id,nombre:APP.user.nombre,lat:pos.coords.latitude,lng:pos.coords.longitude,ts:ts(),activo:true};
    C.set('loc_'+APP.user.id,loc); await sbSave('ubicaciones',loc);
  },e=>console.warn('GPS:',e.message),{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
  toast('📍 GPS activado','info');
}

let _iD=false,_lx=0,_ly=0;
function initFirma(){
  const cv=ge('firma-cv'); if(!cv)return;
  const ctx=cv.getContext('2d'); ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=2; ctx.lineCap='round';
  const pos=e=>{const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;return e.touches?{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy}:{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy}};
  cv.onmousedown=e=>{_iD=true;const p=pos(e);_lx=p.x;_ly=p.y};
  cv.onmousemove=e=>{if(!_iD)return;const p=pos(e);ctx.beginPath();ctx.moveTo(_lx,_ly);ctx.lineTo(p.x,p.y);ctx.stroke();_lx=p.x;_ly=p.y};
  cv.onmouseup=()=>_iD=false;
  cv.addEventListener('touchstart',e=>{e.preventDefault();_iD=true;const p=pos(e);_lx=p.x;_ly=p.y},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();if(!_iD)return;const p=pos(e);ctx.beginPath();ctx.moveTo(_lx,_ly);ctx.lineTo(p.x,p.y);ctx.stroke();_lx=p.x;_ly=p.y},{passive:false});
  cv.addEventListener('touchend',()=>_iD=false);
}
function limpF(){ const cv=ge('firma-cv');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height) }
function cierEnt(id){ const cv=ge('firma-cv'),firma=cv?cv.toDataURL():null; const e=DB.find('entregas',id); DB.save('entregas',{...e,estado:'completada',firmaCliente:firma,correoEnvio:ge('ent-corr').value.trim()}); toast('Entrega cerrada ✓','success'); closeM('m-cient'); goTo('entregas'); }

  <div class="ph"><div><div class="ph-t">🗺️ Mapa Mensajeros</div><div class="ph-s">Ubicación GPS en tiempo real</div></div><div class="ph-a"><button class="btn btn-se" onclick="mapaRefresh()">🔄 Actualizar</button></div></div>

    <div class="card"><div class="ch"><span class="ct">👤 Mensajeros</span></div><div id="lista-mens"><div style="padding:20px;text-align:center;color:var(--ink3)">Cargando...</div></div></div>
    <div class="card"><div class="ch"><span class="ct">🗺️ Mapa en tiempo real</span><div class="ca"><span style="font-size:11px;color:var(--ink3)" id="mapa-st">Cargando...</span></div></div><div id="mapa-ct" style="height:500px;border-radius:0 0 14px 14px;overflow:hidden"></div></div>
  </div>
  <div class="al al-b" style="margin-top:14px">ℹ️ El GPS se activa cuando el mensajero inicia sesión. 🟢 Verde = activo últimos 30 min. Se actualiza automáticamente cada 15 segundos.</div>
  </div>`;

  // Cargar Leaflet CSS
  if(!document.getElementById('leaflet-css')){
    const lk=document.createElement('link');
    lk.id='leaflet-css'; lk.rel='stylesheet';
    lk.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(lk);
  }

  // Cargar Leaflet JS
  if(!window.L){
    await new Promise(resolve=>{
      const s=document.createElement('script');
      s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload=resolve; document.head.appendChild(s);
    });
  }

  // Inicializar mapa centrado en Medellín
  _mapaL = L.map('mapa-ct').setView([6.2071,-75.5748],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap', maxZoom:19
  }).addTo(_mapaL);

  // Cargar ubicaciones
  await mapaRefresh();

  // Auto-refresh cada 15 segundos
  if(_mapaTimer) clearInterval(_mapaTimer);
  _mapaTimer = setInterval(mapaRefresh, 15000);
}

async function mapaRefresh(){
  const ubs = await sbGet('ubicaciones') || [];
  const mens = DB.all('usuarios').filter(u=>u.rol==='mensajero'&&u.activo);
  const now2 = new Date();
  const st = ge('mapa-st');
  if(st) st.textContent = `Actualizado: ${now2.toLocaleTimeString('es-CO')}`;

  // Actualizar lista
  const lista = ge('lista-mens');
  if(lista){
    lista.innerHTML = mens.length ? mens.map(u=>{
      const loc = ubs.find(l=>(l.usuarioId||l.id)===u.id);
      const mins = loc ? Math.floor((now2-new Date(loc.ts))/60000) : null;
      const ac = mins!==null && mins<30;
      return `<div style="padding:14px 16px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div style="width:12px;height:12px;border-radius:50%;background:${ac?'var(--green)':'var(--border)'};flex-shrink:0;${ac?'box-shadow:0 0 0 3px var(--green-l)':''}"></div>
          <div>
            <div style="font-weight:600">${u.nombre}</div>
            <div style="font-size:11px;color:var(--ink3)">${ac?`Activo hace ${mins} min`:'Sin ubicación reciente'}</div>
            ${loc?`<div style="font-size:10px;color:var(--ink3)">📍 ${Number(loc.lat).toFixed(5)}, ${Number(loc.lng).toFixed(5)}</div>`:''}
          </div>
        </div>
        ${loc&&ac?`<div style="display:flex;gap:6px">
          <button class="btn btn-se btn-sm" onclick="mapaIrA(${loc.lat},${loc.lng})">📍 Ver</button>
          <button class="btn btn-se btn-sm" onclick="window.open('https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes','_blank')">🗺️ Waze</button>
        </div>`:''}
      </div>`;
    }).join('') : '<div style="padding:20px;text-align:center;color:var(--ink3)">Sin mensajeros registrados</div>';
  }

  // Actualizar marcadores en el mapa
  if(!_mapaL || !window.L) return;

  mens.forEach(u=>{
    const loc = ubs.find(l=>(l.usuarioId||l.id)===u.id);
    const mins = loc ? Math.floor((now2-new Date(loc.ts))/60000) : null;
    const ac = mins!==null && mins<30;

    if(!loc || !loc.lat || !loc.lng) {
      // Sin ubicación - quitar marcador si existía
      if(_mapaMarkers[u.id]){ _mapaL.removeLayer(_mapaMarkers[u.id]); delete _mapaMarkers[u.id]; }
      return;
    }

    const color = ac ? '#2d6a4f' : '#9090a0';
    const icon = L.divIcon({
      className:'',
      html:`<div style="background:${color};width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700">${u.nombre[0]}</div>`,
      iconSize:[20,20], iconAnchor:[10,10]
    });
    const popup = `<div style="font-family:system-ui;min-width:160px"><div style="font-weight:700;margin-bottom:4px">${u.nombre}</div><div style="font-size:12px;color:#666">${ac?`Activo hace ${mins} min`:'Sin actividad reciente'}</div><div style="font-size:11px;color:#888;margin-top:4px">${fDT(loc.ts)}</div><div style="margin-top:8px"><a href="https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes" target="_blank" style="color:#e63946;font-size:12px;font-weight:600">🗺️ Abrir en Waze</a></div></div>`;

    if(_mapaMarkers[u.id]){
      _mapaMarkers[u.id].setLatLng([loc.lat,loc.lng]).setIcon(icon).bindPopup(popup);
    } else {
      _mapaMarkers[u.id] = L.marker([loc.lat,loc.lng],{icon}).addTo(_mapaL).bindPopup(popup);
    }
  });

  // Si hay marcadores, ajustar vista
  const activos = Object.values(_mapaMarkers);
  if(activos.length===1){
    const pos = activos[0].getLatLng();
    _mapaL.setView([pos.lat,pos.lng],15);
  } else if(activos.length>1){
    const group = L.featureGroup(activos);
    _mapaL.fitBounds(group.getBounds().pad(0.2));
  }
}

function mapaIrA(lat,lng){
  if(_mapaL) _mapaL.setView([lat,lng],17);
}

  </tbody></table></div></div>
  <div class="ov" id="m-usr"><div class="modal sm"><div class="mh"><span class="mt" id="m-usr-t">Usuario</span><button class="mc btn" onclick="closeM('m-usr')">✕</button></div><div class="mb"><input type="hidden" id="usr-id"><div class="fg"><label>Nombre completo <span class="req">*</span></label><input class="fc" id="usr-nom"></div><div class="fg"><label>Correo <span class="req">*</span></label><input class="fc" id="usr-em" type="email"></div><div class="fg"><label>Contraseña <span id="usr-ph" style="font-weight:400;color:var(--ink3)">(requerida)</span></label><input class="fc" id="usr-pw" type="password"></div><div class="fg"><label>Rol</label><select class="fc" id="usr-rol"><option value="coordinador">Coordinador</option><option value="laboratorio">Laboratorio</option><option value="mensajero">Mensajero</option><option value="vendedor">Vendedor</option><option value="superadmin">Superadmin</option></select><div class="hint">Solo coordinador puede cambiar jerarquías</div></div></div><div class="mf"><button class="btn btn-se" onclick="closeM('m-usr')">Cancelar</button><button class="btn btn-pr" onclick="saveUsr()">💾 Guardar</button></div></div></div>
  </div>`;
}
function mUsr(id){if(!isC()){toast('Sin permisos','error');return;}id=id||'';ge('m-usr-t').textContent=id?'Editar Usuario':'Nuevo Usuario';ge('usr-id').value=id;const u=id?DB.find('usuarios',id):{};ge('usr-nom').value=u.nombre||'';ge('usr-em').value=u.email||'';ge('usr-pw').value='';ge('usr-rol').value=u.rol||'laboratorio';ge('usr-ph').textContent=id?'(dejar en blanco para no cambiar)':'(requerida)';openM('m-usr');}
function saveUsr(){if(!isC()){toast('Sin permisos','error');return;}const nom=(ge('usr-nom').value||'').trim(),em=(ge('usr-em').value||'').trim(),pw=(ge('usr-pw').value||'').trim(),rol=ge('usr-rol').value,id=ge('usr-id').value;if(!nom||!em){toast('Nombre y correo obligatorios','error');return;}if(!id&&!pw){toast('Contraseña obligatoria','error');return;}const data={nombre:nom,email:em,rol,activo:true};if(pw)data.password=pw;if(id)data.id=id;DB.save('usuarios',data);toast(id?'Actualizado ✓':'Creado ✓','success');closeM('m-usr');goTo('usuarios');}
function togUsr(id){if(!isC()){toast('Sin permisos','error');return;}const u=DB.find('usuarios',id);if(u){DB.save('usuarios',{...u,activo:!u.activo});goTo('usuarios');}}
function delUsr(id,n){if(!isC()){toast('Sin permisos','error');return;}confirmSA(`Eliminar usuario: ${n}`,()=>{DB.del('usuarios',id);toast('Eliminado','success');goTo('usuarios')})}

  const n=Q.get().length;

  <div class="ph"><div><div class="ph-t">⚙️ Mantenimiento</div><div class="ph-s">Sincronización y administración del sistema</div></div></div>
  <div class="card" style="margin-bottom:16px"><div class="ch"><span class="ct">☁️ Sincronización con Supabase</span></div><div class="cb"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px"><div style="background:var(--surface);border-radius:12px;padding:14px 20px;text-align:center;border:1px solid var(--border)"><div style="font-size:28px;font-weight:800;color:${n>0?'var(--amber)':'var(--green)'}">${n}</div><div style="font-size:11px;color:var(--ink3);margin-top:3px">Pendientes de sync</div></div><div style="background:var(--surface);border-radius:12px;padding:14px 20px;text-align:center;border:1px solid var(--border)"><div style="font-size:24px">${navigator.onLine?'🟢':'🔴'}</div><div style="font-size:11px;color:var(--ink3);margin-top:3px">${navigator.onLine?'Conectado a internet':'Sin conexión'}</div></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-pr" onclick="syncNow().then(()=>pgMant(ge('pg')))">☁️ Sincronizar ahora</button><button class="btn btn-se" onclick="refreshAll()">🔄 Recargar desde Supabase</button><button class="btn btn-se" onclick="pgMant(ge('pg'))">📊 Actualizar estado</button></div></div></div>
  <div class="card" style="border-color:#f9c0c0"><div class="ch" style="background:#fff5f5"><span class="ct" style="color:var(--red-d)">🗑️ Zona de peligro</span></div><div class="cb"><div class="al al-r">⚠️ Estas acciones eliminan datos permanentemente de Supabase. Requieren contraseña Superadmin.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px"><div style="border:1px solid var(--border);border-radius:12px;padding:14px"><div style="font-weight:600;margin-bottom:8px">🧯 Extintores</div><button class="btn btn-da btn-sm" onclick="delAll('extintores')">Borrar todos</button></div><div style="border:1px solid var(--border);border-radius:12px;padding:14px"><div style="font-weight:600;margin-bottom:8px">🏢 Clientes</div><button class="btn btn-da btn-sm" onclick="delAll('clientes')">Borrar todos</button></div><div style="border:1px solid var(--border);border-radius:12px;padding:14px"><div style="font-weight:600;margin-bottom:8px">📦 Órdenes</div><button class="btn btn-da btn-sm" onclick="delOrd()">Borrar todas</button></div><div style="border:1px solid var(--border);border-radius:12px;padding:14px"><div style="font-weight:600;margin-bottom:8px">📝 Auditoría</div><button class="btn btn-da btn-sm" onclick="delAll('auditoria')">Borrar todo</button></div></div><div style="border:2px solid var(--red);border-radius:12px;padding:16px;margin-top:14px;background:var(--red-l)"><div style="font-weight:700;color:var(--red-d);margin-bottom:6px">💥 Borrar TODO el sistema</div><div style="font-size:12px;color:var(--red-d);margin-bottom:12px">Elimina todos los datos. Los usuarios se conservan.</div><button class="btn btn-pr" style="background:var(--red-d)" onclick="delTodo()">💥 Borrar todo</button></div></div></div>
  </div>`;
}

async function delTodo(){confirmSA('BORRAR ABSOLUTAMENTE TODO',async()=>{for(const t of ['clientes','extintores','recolecciones','entregas','laboratorio','visitas','prestamos','alertas','auditoria','materiales']){await fetch(`${SBURL}/rest/v1/${t}?id=neq.NADA`,{method:'DELETE',headers:SBH});C.set(t,[]);}Q.set([]);toast('Borrado. Recargando...','info');setTimeout(()=>location.reload(),1500);})}

  <div class="fg"><label>Contraseña actual <span class="req">*</span></label><input class="fc" id="pf-act" type="password" placeholder="••••••••"></div>
  <div class="fg"><label>Nueva contraseña</label><input class="fc" id="pf-new" type="password" placeholder="Dejar en blanco para no cambiar"></div>
  <div class="fg"><label>Confirmar nueva</label><input class="fc" id="pf-conf" type="password" placeholder="Repetir nueva contraseña"></div>

  <div style="display:flex;gap:10px;margin-top:8px"><button class="btn btn-pr" onclick="savePf()">💾 Guardar</button><button class="btn btn-se" onclick="goTo('dashboard')">Cancelar</button></div>

function savePf(){
  const nom=(ge('pf-nom').value||'').trim(),act=(ge('pf-act').value||'').trim(),nw=(ge('pf-new').value||'').trim(),cf=(ge('pf-conf').value||'').trim();
  if(!nom){toast('Nombre vacío','error');return;}
  if(!act){toast('Ingresa tu contraseña actual','error');return;}
  const u=APP.user;
  const pwOk=String(u.password||u.contrasena||'').trim()===act;
  if(!pwOk){toast('Contraseña actual incorrecta','error');return;}
  if(nw&&nw.length<6){toast('Mínimo 6 caracteres','error');return;}
  if(nw&&nw!==cf){toast('Las contraseñas no coinciden','error');return;}
  const data={...u,nombre:nom}; if(nw)data.password=nw;
  DB.save('usuarios',data); APP.user=data; C.set('session',data);
  toast('Perfil actualizado ✓','success');
  ['pf-act','pf-new','pf-conf'].forEach(id=>{const e=ge(id);if(e)e.value=''});
}

(function(){
  Object.keys(localStorage).forEach(k=>{ if(k.startsWith('safety_')||k.startsWith('scrm_')||k.startsWith('x_s_')) localStorage.removeItem(k) });
  ['clientes','extintores','recolecciones','entregas','laboratorio','materiales','visitas','alertas','prestamos','auditoria','usuarios'].forEach(t=>{ if(!C.get(t)) C.set(t,[]) });
  const s=C.get('session');
  if(s&&s.id){ APP.user=s; refreshAll().then(()=>showApp()); }
  else showLogin();
})();
