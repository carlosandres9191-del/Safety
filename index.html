<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safety CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e;-webkit-font-smoothing:antialiased}
:root{
  --red:#e63946;--red-d:#c1121f;--red-l:#fff0f0;
  --green:#2d6a4f;--green-l:#d8f3dc;
  --amber:#e76f51;--amber-l:#fff3e0;
  --blue:#1d3557;--blue-l:#e8f4f8;
  --purple:#7209b7;--purple-l:#f3e8ff;
  --border:#e8eaf0;--surface:#f8f9fc;
  --white:#ffffff;--ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#9090a0;
}
@keyframes gpsPulse{0%{box-shadow:0 0 0 0 rgba(0,208,132,.5);}70%{box-shadow:0 0 0 14px rgba(0,208,132,0);}100%{box-shadow:0 0 0 0 rgba(0,208,132,0);}}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#d0d0e0;border-radius:99px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}

/* LAYOUT */
.shell{display:flex;min-height:100vh}
#sb{width:260px;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;overflow-y:auto;transition:transform .3s}
#sb.hide{transform:translateX(-100%)}
#main{margin-left:260px;flex:1;min-height:100vh;transition:margin .3s}
#main.full{margin-left:0}

/* SIDEBAR */
.sb-brand{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{display:flex;align-items:center;gap:12px}
.sb-icon{width:40px;height:40px;background:var(--red);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(230,57,70,.4)}
.sb-name{font-weight:700;font-size:14px;letter-spacing:-.3px}
.sb-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px}
.sb-user{margin:16px 12px 8px;background:rgba(255,255,255,.07);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.sb-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--amber));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.sb-uname{font-size:13px;font-weight:600}
.sb-urole{font-size:10px;color:rgba(255,255,255,.45);margin-top:1px}
.sb-sec{padding:16px 20px 6px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.25)}
.ni{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;border-left:3px solid transparent;transition:all .2s;margin:1px 0}
.ni:hover{color:#fff;background:rgba(255,255,255,.06)}
.ni.on{color:#fff;border-left-color:var(--red);background:rgba(230,57,70,.12);font-weight:600}
.ni-ic{width:20px;text-align:center;font-size:15px;flex-shrink:0}
.ni-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px}
.sb-foot{margin-top:auto;padding:16px 12px;border-top:1px solid rgba(255,255,255,.08)}
.sb-sync{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.sb-sync-lbl{font-size:9px;color:rgba(255,255,255,.3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.sb-sync-st{font-size:12px;font-weight:600;color:#2d6a4f;margin-bottom:8px}
.sb-sync-btns{display:flex;gap:6px}
.sb-sync-btns button{flex:1;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border-radius:7px;padding:6px 4px;font-size:10px;font-weight:600;transition:background .2s}
.sb-sync-btns button:hover{background:rgba(255,255,255,.18)}

/* TOPBAR */
#tb{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.tb-title{font-weight:700;font-size:16px;color:var(--ink)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.odot{width:8px;height:8px;border-radius:50%;background:#2d6a4f;box-shadow:0 0 0 3px #d8f3dc}
.odot.off{background:var(--amber);box-shadow:0 0 0 3px var(--amber-l)}

/* PAGE */
#pg{padding:28px;max-width:1440px}

/* CARDS */
.card{background:#fff;border-radius:14px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ch{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.ct{font-weight:700;font-size:14px;color:var(--ink)}
.cb{padding:20px}
.ca{margin-left:auto;display:flex;gap:8px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border-radius:14px;border:1px solid var(--border);padding:18px 20px;cursor:pointer;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.stat-val{font-size:32px;font-weight:800;line-height:1;letter-spacing:-1px}
.stat-lbl{font-size:11px;color:var(--ink3);margin-top:6px;font-weight:500}
.stat-icon{font-size:20px;margin-bottom:8px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:-.2px}
.btn-pr{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(230,57,70,.3)}
.btn-pr:hover{background:var(--red-d);transform:translateY(-1px);box-shadow:0 6px 16px rgba(230,57,70,.4)}
.btn-se{background:var(--surface);color:var(--ink2);border:1.5px solid var(--border)}
.btn-se:hover{background:#eef0f6}
.btn-ou{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn-ou:hover{background:var(--red-l)}
.btn-gh{background:transparent;color:var(--ink3)}
.btn-gh:hover{background:var(--surface);color:var(--ink)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-da{background:#fde8e8;color:#c1121f;border:1px solid #f9c0c0}
.btn-da:hover{background:#f9c0c0}
.btn-gr{background:var(--green-l);color:var(--green);border:1px solid #b7e4c7}
.btn-gr:hover{background:#b7e4c7}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* FORM */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.req{color:var(--red);margin-left:2px}
.fc{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;outline:none;transition:all .2s;background:#fff;color:var(--ink)}
.fc:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,57,70,.08)}
.fc::placeholder{color:#c0c0d0}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:11px;color:var(--ink3);margin-top:4px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.bg{background:var(--green-l);color:var(--green)}
.br{background:var(--red-l);color:var(--red-d)}
.ba{background:var(--amber-l);color:#8d4d00}
.bb{background:var(--blue-l);color:var(--blue)}
.bp{background:var(--purple-l);color:var(--purple)}
.bgr{background:#f0f0f5;color:var(--ink3)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:10px 14px;border-bottom:2px solid var(--border);white-space:nowrap;background:#fafbfc}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbff}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(10,10,30,.5);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:18px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.2);transform:translateY(20px);transition:transform .25s}
.ov.open .modal{transform:translateY(0)}
.modal.sm{max-width:440px}
.modal.lg{max-width:880px}
.mh{padding:22px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.mt{font-weight:700;font-size:16px}
.mc{margin-left:auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:18px}
.mc:hover{background:var(--surface)}
.mb{padding:22px 24px}
.mf{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fafbfc}

/* ALERTS */
.al{padding:11px 14px;border-radius:10px;font-size:13px;display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
.al-r{background:var(--red-l);color:var(--red-d);border:1px solid #f9c0c0}
.al-b{background:var(--blue-l);color:var(--blue);border:1px solid #b8d8e8}
.al-a{background:var(--amber-l);color:#8d4d00;border:1px solid #f4c08a}
.al-g{background:var(--green-l);color:var(--green);border:1px solid #b7e4c7}

/* PAGE HEADER */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.ph-t{font-weight:800;font-size:24px;letter-spacing:-.5px}
.ph-s{font-size:13px;color:var(--ink3);margin-top:3px}
.ph-a{display:flex;gap:10px;flex-wrap:wrap}

/* MISC */
.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-ic{font-size:48px;opacity:.3;margin-bottom:14px}
.empty-t{font-weight:700;font-size:18px;color:var(--ink2);margin-bottom:6px}
.tl{padding-left:22px;position:relative}
.tl::before{content:'';position:absolute;left:7px;top:4px;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-18px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--red)}
.tl-dot.done{background:var(--green);border-color:var(--green)}
.tl-date{font-size:10px;color:var(--ink3);margin-bottom:2px}
.tl-text{font-size:13px}

/* TOAST */
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9000}
.toast{background:#1a1a2e;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:9px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .3s}
.toast.success{border-left:4px solid var(--green)}
.toast.error{border-left:4px solid var(--red)}
.toast.info{border-left:4px solid var(--blue)}
@keyframes tin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* OFFLINE */
#offline{position:fixed;top:0;left:0;right:0;background:var(--amber);color:#fff;text-align:center;padding:7px;font-size:12px;font-weight:600;z-index:9999;transform:translateY(-100%);transition:transform .3s}
#offline.show{transform:translateY(0)}

/* LOGIN */
#login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,.4)}
.login-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--red),var(--amber));border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff;margin:0 auto 18px;box-shadow:0 8px 24px rgba(230,57,70,.4)}
.login-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.login-sub{text-align:center;font-size:12px;color:var(--ink3);margin-bottom:28px}
.login-err{background:var(--red-l);color:var(--red-d);border:1px solid #f9c0c0;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}

@media(max-width:768px){
  #sb{width:260px;transform:translateX(-100%)}
  #sb.mob{transform:translateX(0)!important}
  #main{margin-left:0!important}
  #pg{padding:14px}
  .fg2,.fg3{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .ph{flex-direction:column}
}
@media(max-width:480px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="offline">⚠️ Sin conexión — modo local activo</div>
<div id="toasts"></div>
<div id="app"></div>
<script>
const SBURL = 'https://ilivtsacimtffnaxgtwx.supabase.co';
const SBKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsaXZ0c2FjaW10ZmZuYXhndHd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDI3NzgsImV4cCI6MjA5NDcxODc3OH0.jxY-K5E6mpCN2Ny2lPD46kfuvKXdI_L5OTqll0lLhZk';
const SBH = {'apikey':SBKEY,'Authorization':'Bearer '+SBKEY,'Content-Type':'application/json','Prefer':'return=representation'};
let APP = {user:null,page:'dashboard',timer:null,gps:null};

// ── SUPABASE ───────────────────────────────────────────────────────────
async function sbGet(t,q) {
  q = q||'';
  try {
    const r = await fetch(`${SBURL}/rest/v1/${t}?select=*${q}`,{headers:SBH});
    if(r.ok) return await r.json();
  } catch(e) { console.warn('sbGet',t,e.message); }
  return null;
}
async function sbSave(t,data) {
  try {
    const h = {...SBH,'Prefer':'resolution=merge-duplicates,return=representation'};
    const r = await fetch(`${SBURL}/rest/v1/${t}`,{method:'POST',headers:h,body:JSON.stringify(data)});
    if(r.ok) return await r.json();
    console.warn('sbSave',t,r.status,await r.text());
  } catch(e) { console.warn('sbSave',e.message); }
  return null;
}
async function sbDel(t,id) {
  try {
    const r = await fetch(`${SBURL}/rest/v1/${t}?id=eq.${id}`,{method:'DELETE',headers:SBH});
    return r.ok;
  } catch(e) { return false; }
}

// ── CACHE LOCAL ────────────────────────────────────────────────────────
const C = {
  get(k){ try{return JSON.parse(localStorage.getItem('x_'+k)||'null')}catch{return null} },
  set(k,v){ try{localStorage.setItem('x_'+k,JSON.stringify(v))}catch{} },
  all(k){ return this.get(k)||[] },
  find(k,id){ return this.all(k).find(x=>x.id===id) }
};

// ── DB ─────────────────────────────────────────────────────────────────
const DB = {
  all(t){ return C.all(t) },
  find(t,id){ return C.find(t,id) },
  save(t,item){
    item.id = item.id || uid();
    item.created_at = item.created_at || ts();
    const a = C.all(t);
    const i = a.findIndex(x=>x.id===item.id);
    if(i>=0) a[i]={...a[i],...item}; else a.push(item);
    C.set(t,a);
    sbSave(t,item).then(r=>{ if(!r) Q.add('u',t,item); else syncSt(); });
    return item;
  },
  del(t,id){
    C.set(t,C.all(t).filter(x=>x.id!==id));
    sbDel(t,id).then(ok=>{ if(!ok) Q.add('d',t,{id}); else syncSt(); });
  }
};

// ── QUEUE ──────────────────────────────────────────────────────────────
const Q = {
  get(){ return JSON.parse(localStorage.getItem('pq')||'[]') },
  set(a){ localStorage.setItem('pq',JSON.stringify(a)) },
  add(op,t,data){ const q=this.get(); q.push({op,t,data}); this.set(q); syncSt(); }
};

function syncSt() {
  const n = Q.get().length;
  const el = ge('sync-st');
  if(el){ el.textContent=n>0?`⏳ ${n} pendientes`:'✓ Sincronizado'; el.style.color=n>0?'#e76f51':'#52b788'; }
}

async function syncNow() {
  const q = Q.get(); if(!q.length){ syncSt(); return; }
  const fail = [];
  for(const item of q){
    try {
      const ok = item.op==='u' ? await sbSave(item.t,item.data) : await sbDel(item.t,item.data.id);
      if(!ok && item.op==='u') fail.push(item);
    } catch(e){ fail.push(item); }
  }
  Q.set(fail); syncSt();
  if(q.length-fail.length>0) toast(`${q.length-fail.length} registros sincronizados ✓`,'success');
}

async function refreshAll() {
  const tablas = ['clientes','extintores','recolecciones','entregas','laboratorio','materiales','visitas','alertas','prestamos','auditoria','usuarios'];
  let n = 0;
  for(const t of tablas){
    const d = await sbGet(t);
    if(Array.isArray(d)){ C.set(t,d); n++; }
  }
  syncSt();
  if(n>0){ toast('Datos actualizados ✓','success'); if(APP.page) renderPage(APP.page); }
}

// ── UTILS ──────────────────────────────────────────────────────────────
function uid(){ return Date.now().toString(36)+Math.random().toString(36).substr(2,5) }
function ts(){ return new Date().toISOString() }
function fD(iso){ if(!iso)return'—'; return new Date(iso).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) }
function fDT(iso){ if(!iso)return'—'; return new Date(iso).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) }
function dTo(iso){ if(!iso)return null; return Math.ceil((new Date(iso)-new Date())/864e5) }
function vB(f){ const d=dTo(f); if(d===null)return''; if(d<0)return'<span class="badge br">Vencido</span>'; if(d<=30)return`<span class="badge ba">Vence ${d}d</span>`; if(d<=90)return`<span class="badge bb">Vence ${d}d</span>`; return'<span class="badge bg">Vigente</span>'; }
function eB(e){ const m={activo:['bg','Activo'],en_laboratorio:['bp','En lab'],prestado:['ba','Prestado'],vencido:['br','Vencido'],en_ruta:['bb','En ruta']}; const[c,l]=m[e]||['bgr',e]; return `<span class="badge ${c}">${l}</span>`; }
function oB(e){ const m={pendiente:['ba','⏳ Pendiente'],en_camino:['bb','🚗 En camino'],en_ruta:['bb','🚗 En ruta'],novedad:['bgr','⚠️ Novedad'],recolectado:['bg','✅ Recolectado'],entregado:['bg','✅ Entregado'],completada:['bg','✅ Completada'],cancelada:['bgr','❌ Cancelada'],diagnostico:['bp','🔬 Diagnóstico'],en_proceso:['bb','⚙️ En proceso'],programada:['bb','📅 Programada'],completado:['bg','✅ Completado']}; const[c,l]=m[e]||['bgr',e]; return `<span class="badge ${c}">${l}</span>`; }
function pB(p){ const m={alta:'br',media:'ba',baja:'bg'}; return `<span class="badge ${m[p]||'bgr'}">${p||''}</span>`; }
function rL(r){ return {superadmin:'Superadmin',coordinador:'Coordinador',laboratorio:'Laboratorio',mensajero:'Mensajero',vendedor:'Vendedor'}[r]||r }
function cN(id){ const c=DB.find('clientes',id); return c?c.empresa:'—' }
function eS(id){ const e=DB.find('extintores',id); return e?e.serial:id }
function ge(id){ return document.getElementById(id) }
function qs(s,ctx){ return (ctx||document).querySelector(s) }
function qsa(s,ctx){ return [...(ctx||document).querySelectorAll(s)] }
function isC(){ return APP.user&&(APP.user.rol==='coordinador'||APP.user.rol==='superadmin') }
function can(pg){
  if(!APP.user) return false;
  const p={superadmin:['*'],coordinador:['dashboard','clientes','extintores','recolecciones','entregas','laboratorio','visitas','prestamos','alertas','materiales','auditoria','usuarios','mantenimiento','mapa','perfil'],laboratorio:['dashboard','extintores','laboratorio','materiales','alertas','perfil'],mensajero:['dashboard','recolecciones','entregas','mensajero','alertas','perfil'],vendedor:['dashboard','clientes','extintores','visitas','alertas','perfil']}[APP.user.rol]||[];
  return p.includes('*')||p.includes(pg);
}

function toast(msg,type='info'){
  const icons={success:'✅',error:'❌',info:'ℹ️'};
  const d=document.createElement('div'); d.className=`toast ${type}`;
  d.innerHTML=`<span>${icons[type]}</span><span>${msg}</span>`;
  ge('toasts').appendChild(d); setTimeout(()=>d.remove(),3500);
}

async function doLogin(){
  const email=(ge('l_em').value||'').trim().toLowerCase();
  const pass=(ge('l_pw').value||'').trim();
  const btn=ge('l_btn'), errEl=ge('l_err');
  errEl.style.display='none';
  if(!email||!pass){ errEl.textContent='Ingresa correo y contraseña'; errEl.style.display='block'; return; }
  btn.textContent='Verificando...'; btn.disabled=true;
  try {
    const lista=await sbGet('usuarios');
    if(!lista){ errEl.textContent='Error de conexión. Verifica tu internet.'; errEl.style.display='block'; btn.textContent='Ingresar →'; btn.disabled=false; return; }
    C.set('usuarios',lista);
    const user=lista.find(u=>{
      const eOk=(u.email||'').trim().toLowerCase()===email;
      const pOk=String(u.password||u.contrasena||'').trim()===pass;
      const aOk=u.activo===true||u.activo==='true'||u.activo===1;
      return eOk&&pOk&&aOk;
    });
    if(user){ APP.user=user; C.set('session',user); logA('Login','auth'); await refreshAll(); showApp(); }
    else { errEl.textContent='Correo o contraseña incorrectos'; errEl.style.display='block'; btn.textContent='Ingresar →'; btn.disabled=false; }
  } catch(e){
    console.error('Login:',e);
    errEl.textContent='Error: '+e.message; errEl.style.display='block';
    btn.textContent='Ingresar →'; btn.disabled=false;
  }
}

let _gpsEnvios = 0;
let _gpsWatch  = null;
let _gpsTimer  = null;

function mensajeroActivarGPS(){
  if(!navigator.geolocation){
    _gpsAlerta('Tu dispositivo no soporta GPS.');
    return;
  }
  const btn = ge('btn-gps');
  if(btn){ btn.textContent='⏳ Obteniendo señal GPS...'; btn.disabled=true; }

  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      _gpsSendPos(pos);
      _gpsSetActivo();
      // Watch continuo
      if(_gpsWatch) navigator.geolocation.clearWatch(_gpsWatch);
      _gpsWatch = navigator.geolocation.watchPosition(
        (p)=>_gpsSendPos(p),
        (e)=>_gpsOnError(e),
        {enableHighAccuracy:true, timeout:15000, maximumAge:5000}
      );
      // Heartbeat cada 10s por si watchPosition se detiene
      if(_gpsTimer) clearInterval(_gpsTimer);
      _gpsTimer = setInterval(()=>{
        navigator.geolocation.getCurrentPosition(
          (p)=>_gpsSendPos(p),
          ()=>{},
          {enableHighAccuracy:true, timeout:10000, maximumAge:8000}
        );
      }, 10000);
    },
    (err)=>{
      if(btn){ btn.textContent='📍 Activar GPS y transmitir'; btn.disabled=false; }
      _gpsOnError(err);
    },
    {enableHighAccuracy:true, timeout:20000, maximumAge:0}
  );
}

function startGPS(){
  if(!navigator.geolocation){ toast('GPS no disponible','error'); return; }
  
  function enviarUbicacion(pos){
    const loc = {
      id: APP.user.id,
      usuarioId: APP.user.id,
      nombre: APP.user.nombre,
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      precision: pos.coords.accuracy,
      ts: ts(),
      activo: true
    };
    // Guardar en cache
    C.set('loc_'+APP.user.id, loc);
    // Guardar directo en Supabase REST (sin WebSocket)
    fetch(SBURL+'/rest/v1/ubicaciones', {
      method: 'POST',
      headers: {...SBH, 'Prefer':'resolution=merge-duplicates'},
      body: JSON.stringify(loc)
    }).catch(e=>console.warn('GPS save error:',e.message));
    // Actualizar indicador en pantalla
    const ind = ge('gps-indicador');
    if(ind) ind.textContent = '📍 GPS activo — '+Number(loc.lat).toFixed(5)+', '+Number(loc.lng).toFixed(5);
  }

  function errorGPS(err){
    console.warn('GPS error:', err.code, err.message);
    const msgs = {1:'Permiso denegado',2:'Sin señal GPS',3:'Tiempo agotado'};
    toast('GPS: '+(msgs[err.code]||err.message),'error');
  }

  APP.gps = navigator.geolocation.watchPosition(
    enviarUbicacion,
    errorGPS,
    {enableHighAccuracy:true, maximumAge:8000, timeout:12000}
  );

function iniciarRealtime(){
  if(APP.realtimeChannel) return;
  // Usar Supabase Realtime WebSocket
  const wsUrl = SBURL.replace('https://','wss://') + '/realtime/v1/websocket?apikey=' + SBKEY + '&vsn=1.0.0';
  const ws = new WebSocket(wsUrl);
  const channelName = 'gps-mensajeros';
  APP.ws = ws;
  ws.onopen = ()=>{
    // Unirse al canal
    ws.send(JSON.stringify({topic:`realtime:${channelName}`,event:'phx_join',payload:{config:{broadcast:{self:true}}},ref:'1'}));
  };
  ws.onmessage = (msg)=>{
    try {
      const data = JSON.parse(msg.data);
      if(data.event==='broadcast'&&data.payload&&data.payload.payload){
        const loc = data.payload.payload;
        // Actualizar cache con ubicación recibida
        C.set('loc_'+loc.usuarioId, loc);
        // Si el mapa está abierto, actualizar marcador
        if(_mapaL && window.L && loc.lat && loc.lng) actualizarMarcador(loc);
      }
    } catch(e){}
  };
  ws.onerror = e=>console.warn('WS error:',e);
  ws.onclose = ()=>{ APP.realtimeChannel=null; APP.ws=null; };
  APP.realtimeChannel = {
    send: (payload)=>{
      if(ws.readyState===1){
        ws.send(JSON.stringify({
          topic:`realtime:${channelName}`,
          event:'broadcast',
          payload: payload,
          ref: Date.now().toString()
        }));
      }
    }
  };
}

function suscribirMapa(){
  // Suscribirse al canal para recibir ubicaciones en tiempo real
  if(APP.ws && APP.ws.readyState===1) return; // ya conectado
  iniciarRealtime();
}

function actualizarMarcador(loc){
  if(!_mapaL||!window.L) return;
  const u = DB.find('usuarios', loc.usuarioId);
  const nombre = u ? u.nombre : (loc.nombre||'Mensajero');
  const icon = L.divIcon({
    className:'',
    html:`<div style="background:#2d6a4f;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700">${nombre[0]}</div>`,
    iconSize:[22,22], iconAnchor:[11,11]
  });
  const popup = `<div style="font-family:system-ui;min-width:160px"><div style="font-weight:700;margin-bottom:4px">${nombre}</div><div style="font-size:11px;color:#888">${fDT(loc.ts)}</div><div style="margin-top:8px"><a href="https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes" target="_blank" style="color:#e63946;font-size:12px;font-weight:600">🗺️ Waze</a></div></div>`;
  if(_mapaMarkers[loc.usuarioId]){
    _mapaMarkers[loc.usuarioId].setLatLng([loc.lat,loc.lng]).setIcon(icon).bindPopup(popup);
  } else {
    _mapaMarkers[loc.usuarioId]=L.marker([loc.lat,loc.lng],{icon}).addTo(_mapaL).bindPopup(popup);
  }
  // Actualizar lista si existe
  const item = document.getElementById('mens-'+loc.usuarioId);
  if(item){
    item.innerHTML=`<span style="color:#2d6a4f;font-weight:600">🟢 En vivo</span> — ${Number(loc.lat).toFixed(4)}, ${Number(loc.lng).toFixed(4)}`;
  }
}

let _extFoto = null;

function cargarFoto(input){
  const file = input.files[0]; if(!file)return;
  const reader = new FileReader();
  reader.onload = e=>{
    _extFoto = e.target.result;
    const prev = ge('ext-foto-prev');
    if(prev) prev.innerHTML=`<img src="${_extFoto}" style="width:100%;max-height:180px;object-fit:cover;border-radius:10px;border:1.5px solid var(--border)">`;
  };
  reader.readAsDataURL(file);
}

  _extFoto = null;
  const prev = ge('ext-foto-prev'); if(prev) prev.innerHTML='';
  const inp = ge('ext-foto-input'); if(inp) inp.value='';

// ── UTILIDAD TOGGLE PANEL ────────────────────────────────────────────────
function togglePanel(panelId, btnId){
  const p=ge(panelId),b=ge(btnId);
  if(!p||!b) return;
  const vis=p.style.display==='none';
  p.style.display=vis?'block':'none';
  if(vis){ b.textContent='✕ Cerrar'; b.style.background='var(--red)'; }
  else { b.textContent = panelId.includes('cl')?'+ Crear cliente':'+ Agregar producto'; b.style.background=panelId.includes('cl')?'var(--green)':'var(--blue)'; }
}

// ── CREAR CLIENTE DESDE ORDEN ─────────────────────────────────────────────
function crearClienteEnOrden(tipo){
  const pfx = tipo==='rec' ? 'ncl' : 'ncl-ent';
  const empresa=(ge(pfx+'-empresa')?.value||'').trim();
  const tel=(ge(pfx+'-tel')?.value||'').trim();
  if(!empresa){toast('El nombre de la empresa es obligatorio','error');return;}
  if(!tel){toast('El teléfono es obligatorio','error');return;}

  const nuevo = DB.save('clientes',{
    empresa,
    nit:       ge(pfx+'-nit')?.value?.trim()||'',
    contacto:  ge(pfx+'-contacto')?.value?.trim()||'',
    telefono:  tel,
    email:     ge(pfx+'-email')?.value?.trim()||'',
    ciudad:    ge(pfx+'-ciudad')?.value?.trim()||'',
    direccion: ge(pfx+'-dir')?.value?.trim()||'',
    activo:    true
  });

  // Agregar al select y seleccionar
  const selId = tipo==='rec' ? 'rec-cl' : 'ent-cl';
  const sel=ge(selId);
  if(sel){
    const opt=document.createElement('option');
    opt.value=nuevo.id; opt.textContent=empresa+(nuevo.nit?' — NIT '+nuevo.nit:'');
    opt.selected=true;
    sel.appendChild(opt);
    sel.dispatchEvent(new Event('change'));
  }

  const msgId = tipo==='rec' ? 'msg-nuevo-cl-rec' : 'msg-nuevo-cl-ent';
  const msg=ge(msgId);
  if(msg) msg.innerHTML=`<span style="color:var(--green);">✓ Cliente <b>${empresa}</b> creado y seleccionado</span>`;

  // Cerrar panel
  const panelId = tipo==='rec' ? 'panel-nuevo-cl-rec' : 'panel-nuevo-cl-ent';
  const btnId   = tipo==='rec' ? 'btn-nuevo-cl-rec'   : 'btn-nuevo-cl-ent';
  const pan=ge(panelId),btn=ge(btnId);
  if(pan) pan.style.display='none';
  if(btn){ btn.textContent='+ Crear cliente'; btn.style.background='var(--green)'; }
  toast(`Cliente ${empresa} creado ✓`,'success');
}

let _iD=false,_lx=0,_ly=0;
function initFirma(){
  const cv=ge('firma-cv'); if(!cv)return;
  const ctx=cv.getContext('2d'); ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=2; ctx.lineCap='round';
  const pos=e=>{const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;return e.touches?{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy}:{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy}};
  cv.onmousedown=e=>{_iD=true;const p=pos(e);_lx=p.x;_ly=p.y};
  cv.onmousemove=e=>{if(!_iD)return;const p=pos(e);ctx.beginPath();ctx.moveTo(_lx,_ly);ctx.lineTo(p.x,p.y);ctx.stroke();_lx=p.x;_ly=p.y};
  cv.onmouseup=()=>_iD=false;
  cv.addEventListener('touchstart',e=>{e.preventDefault();_iD=true;const p=pos(e);_lx=p.x;_ly=p.y},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();if(!_iD)return;const p=pos(e);ctx.beginPath();ctx.moveTo(_lx,_ly);ctx.lineTo(p.x,p.y);ctx.stroke();_lx=p.x;_ly=p.y},{passive:false});
  cv.addEventListener('touchend',()=>_iD=false);
}
function limpF(){ const cv=ge('firma-cv');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height) }
function cierEnt(id){ const cv=ge('firma-cv'),firma=cv?cv.toDataURL():null; const e=DB.find('entregas',id); DB.save('entregas',{...e,estado:'completada',firmaCliente:firma,correoEnvio:ge('ent-corr').value.trim()}); toast('Entrega cerrada ✓','success'); closeM('m-cient'); goTo('entregas'); }

function adjCant(extId,delta){
  const inp=ge('cant-'+extId);if(!inp)return;
  const v=Math.max(0,Math.min(99,(parseInt(inp.value)||0)+delta));
  inp.value=v;_recCants[extId]=v;
}

function addFotoRec(inp){
  if(!inp.files||!inp.files[0])return;
  const r=new FileReader();
  r.onload=ev=>{
    _recFotos.push(ev.target.result);
    const cnt=ge('foto-cnt');if(cnt)cnt.textContent=_recFotos.length+' foto(s)';
    const prev=ge('fotos-prev');
    if(prev){
      const idx=_recFotos.length-1;
      const d=document.createElement('div');d.style.cssText='position:relative;';
      d.innerHTML=`<img src="${ev.target.result}" style="width:75px;height:75px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.1);">
        <button onclick="delFotoRec(${idx},this.parentNode)" style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;background:#f85149;border:none;border-radius:50%;color:#fff;font-size:10px;cursor:pointer;">✕</button>`;
      prev.appendChild(d);
    }
  };
  r.readAsDataURL(inp.files[0]);
  inp.value='';
}

function delFotoRec(idx,el){_recFotos.splice(idx,1);if(el)el.remove();const cnt=ge('foto-cnt');if(cnt)cnt.textContent=_recFotos.length+' foto(s)';}

function initFirmaRec(){
  const cv=ge('firma-rec-cv');if(!cv)return;
  const ctx=cv.getContext('2d');ctx.strokeStyle='#111';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  const pos=ev=>{const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;
    return ev.touches?{x:(ev.touches[0].clientX-r.left)*sx,y:(ev.touches[0].clientY-r.top)*sy}:{x:(ev.clientX-r.left)*sx,y:(ev.clientY-r.top)*sy}};
  cv.onmousedown=ev=>{_iDRec=true;const p=pos(ev);_lxRec=p.x;_lyRec=p.y};
  cv.onmousemove=ev=>{if(!_iDRec)return;const p=pos(ev);ctx.beginPath();ctx.moveTo(_lxRec,_lyRec);ctx.lineTo(p.x,p.y);ctx.stroke();_lxRec=p.x;_lyRec=p.y};
  cv.onmouseup=()=>_iDRec=false;
  cv.addEventListener('touchstart',ev=>{ev.preventDefault();_iDRec=true;const p=pos(ev);_lxRec=p.x;_lyRec=p.y},{passive:false});
  cv.addEventListener('touchmove',ev=>{ev.preventDefault();if(!_iDRec)return;const p=pos(ev);ctx.beginPath();ctx.moveTo(_lxRec,_lyRec);ctx.lineTo(p.x,p.y);ctx.stroke();_lxRec=p.x;_lyRec=p.y},{passive:false});
  cv.addEventListener('touchend',()=>_iDRec=false);
}
function limpFirmaRec(){const cv=ge('firma-rec-cv');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}

async function finalizarRecConFirma(id){
  const cv=ge('firma-rec-cv');if(!cv){toast('Error','error');return;}
  const px=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;
  if(!px.some((v,i)=>i%4===3&&v>0)){toast('El cliente debe firmar para continuar','error');return;}
  const email=ge('rec-email-cl')?.value?.trim()||'';
  if(!email){toast('Ingresa el correo del cliente','error');return;}

  const btn=ge('btn-finalizar-rec');
  if(btn){btn.textContent='Guardando en Supabase...';btn.disabled=true;}

  const firma=cv.toDataURL();
  const r=DB.find('recolecciones',id);if(!r)return;
  const cl=DB.find('clientes',r.clienteId)||{};

  // Construir datos para Supabase
  const datosGuardar={
    ...r,
    estado: _recHayNov?'novedad':'recolectado',
    firmaCliente: firma,
    fotoRecoleccion: _recFotos[0]||null,
    observaciones: _recObs||null,
    cantidades: JSON.stringify(_recExtsConf.map(e=>({serial:e.serial,tipo:e.tipo,capacidad:e.capacidad||'',cantRecogida:e.cantRecogida}))),
    correoCliente: email,
    fechaRecoleccion: new Date().toISOString(),
    mensajeroNombre: APP.user.nombre
  };

  if(_recHayNov){
    const diffs=_recExtsConf.filter(e=>e.cantRecogida!==1).map(e=>`${e.serial}: esperado 1, recogido ${e.cantRecogida}`).join('; ');
    datosGuardar.novedad=`Diferencia en cantidades: ${diffs}`;
    datosGuardar.novedadAutorizada=false;
    // Alerta para coordinador en Supabase
    DB.save('alertas',{
      tipo:'novedad_recoleccion',
      mensaje:`⚠️ NOVEDAD recolección ${cl.empresa||''}: ${diffs} — Mensajero: ${APP.user.nombre}`,
      usuarioDestino:'coordinador',
      leida:false
    });
  }

  // Guardar en Supabase via DB.save (guarda local + envía a Supabase)
  DB.save('recolecciones', datosGuardar);

  // Enviar correo — fallback a mailto
  try{
    const inventarioTexto=_recExtsConf.map(e=>`• ${e.serial} — ${e.tipo||''} ${e.capacidad||''}: ${e.cantRecogida} unid.`).join('\n');
    const asunto=encodeURIComponent(`Confirmación recolección extintores — ${cl.empresa||''}`);
    const cuerpo=encodeURIComponent(`Estimado cliente,\n\nExtintores Safety S.A.S realizó la recolección el ${new Date().toLocaleDateString('es-CO')}.\n\nInventario recolectado:\n${inventarioTexto}\n${_recObs?'\nObservaciones: '+_recObs:''}\n\nMensajero: ${APP.user.nombre}\n\nGracias por su confianza.\nExtintores Safety S.A.S\nPBX: 444 75 71`);
    window.open(`mailto:${email}?subject=${asunto}&body=${cuerpo}`,'_blank');
    toast(`✅ Guardado en Supabase. Se abrió el correo para ${email}`,'success');
  }catch(err){
    toast('✅ Recolección guardada en Supabase','success');
  }

  _recFotos=[];_recExtsConf=[];_recHayNov=false;_recObs='';_recCants={};
  closeM('m-firma-rec');
  // Refrescar vista
  setTimeout(()=>pgMens(ge('pg')),500);
}

function checkDispositivoBodega(){
  const inp=ge('verif-codigo'); if(!inp) return;
  const codigo=(inp.value||'').trim().replace(/\s/g,'');
  if(!codigo){ toast('Ingresa un código o serial','error'); return; }

  const res=ge('verif-resultado');
  const lista=ge('verif-lista');

  // Buscar extintor por serial exacto o parecido
  const todos=DB.all('extintores');
  const encontrado=todos.find(e=>
    e.serial?.toLowerCase()===codigo.toLowerCase() ||
    e.serial?.replace(/\s/g,'').toLowerCase()===codigo.toLowerCase()
  );

  if(!encontrado){
    res.innerHTML=`<div style="color:var(--red);background:rgba(230,57,70,.1);border-radius:8px;padding:10px 14px;border-left:3px solid var(--red);">❌ Código <b>${codigo}</b> no encontrado en la base de datos</div>`;
    inp.value='';
    return;
  }

  const cl=DB.find('clientes',encontrado.clienteId)||{};
  const yaVerif=window._verifRec?.verificados?.[encontrado.id];

  // Marcar como verificado
  if(window._verifRec) window._verifRec.verificados[encontrado.id]=true;

  res.innerHTML=`<div style="color:#52b788;background:rgba(82,183,136,.1);border-radius:8px;padding:10px 14px;border-left:3px solid #52b788;">
    ✅ Dispositivo encontrado: <b>${encontrado.serial}</b> — ${encontrado.tipo||''} ${encontrado.capacidad||''}<br>
    <span style="font-size:12px;color:var(--ink3);">Cliente: ${cl.empresa||'—'} · Estado: ${encontrado.estado||'activo'}</span>
    ${yaVerif?'<br><span style="font-size:11px;color:#f0883e;">⚠️ Ya verificado anteriormente en esta sesión</span>':''}
  </div>`;

  // Actualizar estado del extintor a 'en_bodega'
  DB.save('extintores',{...encontrado, estado:'en_bodega'});

  // Agregar a lista verificados
  if(!lista.innerHTML.includes(encontrado.serial)){

function generarOrdenLab(recId){
  if(!isC()){toast('Solo coordinadores','error');return;}
  const r=DB.find('recolecciones',recId); if(!r)return;
  const exts=(r.extintores||[]).map(i=>DB.find('extintores',i)).filter(Boolean);
  if(!exts.length){toast('No hay extintores en esta recolección','error');return;}

  const tecnicos=DB.all('usuarios').filter(u=>u.rol==='laboratorio'||u.rol==='coordinador');
  const ov=document.createElement('div'); ov.className='ov open'; ov.style.zIndex='9999';
  ov.innerHTML=`<div class="modal" style="width:480px;">
    <div class="mh"><span class="mt">🔬 Nueva orden de laboratorio</span><button class="mc btn" onclick="this.closest('.ov').remove()">✕</button></div>

        <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;margin-bottom:8px;">Extintores incluidos</div>
        ${exts.map(e=>`<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--border);">🧯 <b>${e.serial}</b> — ${e.tipo||''} ${e.capacidad||''}</div>`).join('')}

      <button class="btn btn-se" onclick="this.closest('.ov').remove()">Cancelar</button>

function confirmarOrdenLab(recId, btn){
  const r=DB.find('recolecciones',recId); if(!r)return;
  const exts=(r.extintores||[]).map(i=>DB.find('extintores',i)).filter(Boolean);
  const tecnicoId=ge('lab-tec-rec')?.value||'';
  const prioridad=ge('lab-pri-rec')?.value||'media';

  // Crear una orden de laboratorio por cada extintor
  exts.forEach(e=>{
    DB.save('laboratorio',{
      extintor: e.id,
      clienteId: e.clienteId||r.clienteId,
      tecnicoId,
      prioridad,
      estado: 'diagnostico',
      diagnostico: '',
      materialesRequeridos: [],
      aprobadoCliente: false,
      origenRecoleccion: recId
    });
    // Actualizar estado del extintor
    DB.save('extintores',{...e, estado:'en_laboratorio'});
  });

  // Cerrar recolección como completada
  DB.save('recolecciones',{...r, estado:'completada', fechaCierre:new Date().toISOString()});

  btn.closest('.ov').remove();
  closeOv('m-verif-rec');
  toast(`✅ ${exts.length} orden(es) de laboratorio creadas`,'success');
  goTo('recolecciones');
}

function marcarEnBodega(recId){
  if(!isC()){toast('Solo coordinadores','error');return;}
  const r=DB.find('recolecciones',recId); if(!r)return;
  DB.save('recolecciones',{...r, estado:'completada', fechaCierre:new Date().toISOString(), enBodega:true});
  // Marcar extintores en bodega
  (r.extintores||[]).forEach(eid=>{
    const e=DB.find('extintores',eid);
    if(e) DB.save('extintores',{...e,estado:'en_bodega'});
  });
  closeOv('m-verif-rec');
  toast('📦 Recolección cerrada — extintores en bodega','success');
  goTo('recolecciones');
}

function autorizarNovedad(recId){
  if(!isC()){toast('Solo coordinadores','error');return;}
  const r=DB.find('recolecciones',recId);if(!r)return;
  DB.save('recolecciones',{...r,novedadAutorizada:true,estado:'completada'});
  DB.all('alertas').filter(a=>a.tipo==='novedad_recoleccion'&&!a.leida).forEach(a=>DB.save('alertas',{...a,leida:true}));
  toast('✅ Novedad autorizada','success');goTo('recolecciones');
}

let _mapaL = null, _mapaMarkers = {}, _mapaTimer = null;
// Tiempo en minutos sin señal para considerar desconectado
const MINS_DESCONECTADO = 3;

async function pgMapa(c){
  c.innerHTML=`<div style="padding:24px">
  <div class="ph" style="margin-bottom:16px;">
    <div><div class="ph-t">🗺️ Mapa Mensajeros</div><div class="ph-s">Estado GPS en tiempo real · se actualiza cada 8 seg</div></div>
    <div class="ph-a">
      <span id="mapa-st" style="font-size:11px;padding:4px 12px;border-radius:99px;border:1px solid var(--border);color:var(--ink3);">⏳ Cargando...</span>
      <button class="btn btn-se btn-sm" onclick="mapaRefresh()" style="margin-left:8px;">🔄 Actualizar</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start;">
    <div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--ink2);">👥 Mensajeros</div>
        <div id="lista-mens" style="max-height:540px;overflow-y:auto;">
          <div style="padding:30px;text-align:center;color:var(--ink3)">⏳ Cargando...</div>
        </div>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div id="mapa-ct" style="height:520px;"></div>
    </div>
  </div>
  </div>`;

  if(!document.getElementById('leaflet-css')){
    const lk=document.createElement('link');
    lk.id='leaflet-css';lk.rel='stylesheet';
    lk.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(lk);
  }
  if(!window.L){
    await new Promise(resolve=>{
      const s=document.createElement('script');
      s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload=resolve;document.head.appendChild(s);
    });
  }

  _mapaL=L.map('mapa-ct').setView([6.2071,-75.5748],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:19
  }).addTo(_mapaL);

  await mapaRefresh();
  if(_mapaTimer) clearInterval(_mapaTimer);
  _mapaTimer=setInterval(mapaRefresh,8000);
}

async function mapaRefresh(){
  const ubs=await sbGet('ubicaciones')||[];
  const mens=DB.all('usuarios').filter(u=>u.rol==='mensajero'&&u.activo);
  const now=new Date();

  // Actualizar estado en topbar
  const st=ge('mapa-st');
  if(st){
    st.textContent=`✓ ${now.toLocaleTimeString('es-CO')}`;
    st.style.cssText='font-size:11px;padding:4px 12px;border-radius:99px;border:1px solid #b7e4c7;background:#f0fdf4;color:#2d6a4f;';
  }

  // Clasificar mensajeros
  const estados=mens.map(u=>{
    const loc=ubs.find(l=>(l.usuarioId||l.id)===u.id);
    const mins=loc?Math.floor((now-new Date(loc.ts))/60000):null;
    const conectado=mins!==null&&mins<MINS_DESCONECTADO;
    return {u,loc,mins,conectado};
  });

  // Actualizar lista
  const lista=ge('lista-mens');
  if(lista){
    if(!mens.length){
      lista.innerHTML='<div style="padding:24px;text-align:center;color:var(--ink3);">Sin mensajeros registrados</div>';
    } else {
      // Ordenar: conectados primero
      const ordenados=[...estados].sort((a,b)=>b.conectado-a.conectado);
      lista.innerHTML=ordenados.map(({u,loc,mins,conectado})=>{
        const tiempoTxt=mins===null?'Sin señal':mins<1?'Hace menos de 1 min':mins<60?`Hace ${mins} min`:`Hace ${Math.floor(mins/60)}h ${mins%60}min`;
        return `<div style="padding:12px 16px;border-bottom:1px solid var(--border);${conectado?'':'opacity:.75;'}">
          <div style="display:flex;align-items:center;gap:10px;">
            <!-- AVATAR CON DOT DE ESTADO -->
            <div style="position:relative;flex-shrink:0;">
              <div style="width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--ink1);">${u.nombre[0]}</div>
              <!-- DOT ESTADO -->
              <div style="position:absolute;bottom:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:${conectado?'#52b788':'var(--red)'};border:2px solid var(--bg);${conectado?'box-shadow:0 0 0 2px rgba(82,183,136,.3);':''}"></div>
            </div>
            <!-- INFO -->
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
                <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${u.nombre}</div>
                <span style="font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;flex-shrink:0;background:${conectado?'rgba(82,183,136,.15)':'rgba(230,57,70,.12)'};color:${conectado?'#52b788':'var(--red)'};">${conectado?'Activo':'Sin señal'}</span>
              </div>
              <div style="font-size:11px;color:var(--ink3);">🕐 ${tiempoTxt} ${loc?`· 📍 ${Number(loc.lat).toFixed(4)}, ${Number(loc.lng).toFixed(4)}`:'· sin ubicación'}</div>
            </div>
          </div>
          ${loc&&conectado?`<div style="display:flex;gap:6px;margin-top:8px;padding-left:48px;">
            <button class="btn btn-se btn-sm" onclick="mapaIrA(${loc.lat},${loc.lng})">📍 Centrar</button>
            <button class="btn btn-se btn-sm" onclick="window.open('https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes','_blank')">🗺️ Waze</button>
          </div>`:''}
        </div>`;
      }).join('');
    }
  }

  // Actualizar marcadores en mapa
  if(!_mapaL||!window.L) return;

  const idsActivos=new Set();
  estados.forEach(({u,loc,mins,conectado})=>{
    if(!loc||!loc.lat||!loc.lng){
      if(_mapaMarkers[u.id]){_mapaL.removeLayer(_mapaMarkers[u.id]);delete _mapaMarkers[u.id];}
      return;
    }
    idsActivos.add(u.id);

    // Icono con color según estado
    const color=conectado?'#52b788':'#e63946';
    const ring=conectado?`box-shadow:0 0 0 3px rgba(82,183,136,.3);`:'';
    const icon=L.divIcon({
      className:'',
      html:`<div style="position:relative;">
        <div style="width:36px;height:36px;border-radius:50%;background:${color};border:3px solid #fff;${ring}display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);">${u.nombre[0]}</div>
        ${conectado?'<div style="position:absolute;bottom:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#52b788;border:2px solid #fff;"></div>':'<div style="position:absolute;bottom:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#e63946;border:2px solid #fff;"></div>'}
      </div>`,
      iconSize:[36,36],iconAnchor:[18,18],popupAnchor:[0,-20]
    });

    const tiempoTxt=mins===null?'Sin datos':mins<1?'Hace menos de 1 min':mins<60?`Hace ${mins} min`:`Hace ${Math.floor(mins/60)}h ${mins%60}min`;
    const popup=`<div style="font-family:system-ui;min-width:180px;padding:4px;">
      <div style="font-weight:700;font-size:14px;margin-bottom:6px;">${u.nombre}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;"></div>
        <span style="font-size:12px;font-weight:600;color:${color};">${conectado?'CONECTADO':'DESCONECTADO'}</span>
      </div>
      <div style="font-size:12px;color:#666;margin-bottom:4px;">🕐 ${tiempoTxt}</div>
      <div style="font-size:11px;color:#999;margin-bottom:8px;">📍 ${Number(loc.lat).toFixed(5)}, ${Number(loc.lng).toFixed(5)}</div>
      ${conectado?`<a href="https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes" target="_blank" style="color:#e63946;font-size:12px;font-weight:600;text-decoration:none;">🗺️ Abrir en Waze</a>`:''}
    </div>`;

    if(_mapaMarkers[u.id]){
      _mapaMarkers[u.id].setLatLng([loc.lat,loc.lng]).setIcon(icon).setPopupContent(popup);
    } else {
      _mapaMarkers[u.id]=L.marker([loc.lat,loc.lng],{icon}).addTo(_mapaL).bindPopup(popup);
    }
  });

  // Quitar marcadores de mensajeros eliminados
  Object.keys(_mapaMarkers).forEach(id=>{
    if(!idsActivos.has(id)){_mapaL.removeLayer(_mapaMarkers[id]);delete _mapaMarkers[id];}
  });

  // Ajustar vista si hay activos
  const activos=Object.values(_mapaMarkers);
  if(activos.length===1){
    _mapaL.setView(activos[0].getLatLng(),14);
  } else if(activos.length>1){
    try{ _mapaL.fitBounds(L.latLngBounds(activos.map(m=>m.getLatLng())),{padding:[40,40]}); }catch(e){}
  }
}


function mapaIrA(lat,lng){
  if(_mapaL) _mapaL.setView([lat,lng],17);
}

async function delAll(t){confirmSA(`Borrar tabla: ${t}`,async()=>{await fetch(`${SBURL}/rest/v1/${t}?id=neq.NADA`,{method:'DELETE',headers:SBH});C.set(t,[]);toast('Borrado ✓','success');pgMant(ge('pg'));})}
async function delOrd(){confirmSA('Borrar todas las órdenes',async()=>{for(const t of ['recolecciones','entregas','laboratorio','visitas','prestamos']){await fetch(`${SBURL}/rest/v1/${t}?id=neq.NADA`,{method:'DELETE',headers:SBH});C.set(t,[]);}toast('Borrado ✓','success');pgMant(ge('pg'));})}
async function delTodo(){confirmSA('BORRAR ABSOLUTAMENTE TODO',async()=>{for(const t of ['clientes','extintores','recolecciones','entregas','laboratorio','visitas','prestamos','alertas','auditoria','materiales']){await fetch(`${SBURL}/rest/v1/${t}?id=neq.NADA`,{method:'DELETE',headers:SBH});C.set(t,[]);}Q.set([]);toast('Borrado. Recargando...','info');setTimeout(()=>location.reload(),1500);})}

// ── PERFIL ─────────────────────────────────────────────────────────────────
function pgPerfil(c){
  const u=APP.user;
  const rc={superadmin:'br',coordinador:'bp',laboratorio:'bb',mensajero:'ba',vendedor:'bg'};
  c.innerHTML=`<div style="padding:28px">
  <div class="ph"><div><div class="ph-t">👤 Mi Perfil</div></div></div>
  <div style="max-width:480px"><div class="card"><div class="cb">
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)">
    <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--amber));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:26px;box-shadow:0 6px 18px rgba(230,57,70,.3)">${u.nombre[0]}</div>
    <div><div style="font-weight:700;font-size:18px">${u.nombre}</div><div style="color:var(--ink3);font-size:13px">${u.email}</div><span class="badge ${rc[u.rol]||'bgr'}" style="margin-top:6px">${rL(u.rol)}</span></div>
  </div>
  <div class="fg"><label>Nombre completo <span class="req">*</span></label><input class="fc" id="pf-nom" value="${u.nombre}"></div>
  <div style="border-top:1px solid var(--border);margin:16px 0"></div>
  <div style="font-weight:700;margin-bottom:12px">🔒 Cambiar contraseña</div>
  <div class="fg"><label>Contraseña actual <span class="req">*</span></label><input class="fc" id="pf-act" type="password" placeholder="••••••••"></div>
  <div class="fg"><label>Nueva contraseña</label><input class="fc" id="pf-new" type="password" placeholder="Dejar en blanco para no cambiar"></div>
  <div class="fg"><label>Confirmar nueva</label><input class="fc" id="pf-conf" type="password" placeholder="Repetir nueva contraseña"></div>
  <div class="al al-b">🔐 Tu rol es <b>${rL(u.rol)}</b>. Solo el coordinador puede cambiar jerarquías.</div>
  <div style="display:flex;gap:10px;margin-top:8px"><button class="btn btn-pr" onclick="savePf()">💾 Guardar</button><button class="btn btn-se" onclick="goTo('dashboard')">Cancelar</button></div>
  </div></div></div>
  </div>`;
}
function savePf(){
  const nom=(ge('pf-nom').value||'').trim(),act=(ge('pf-act').value||'').trim(),nw=(ge('pf-new').value||'').trim(),cf=(ge('pf-conf').value||'').trim();
  if(!nom){toast('Nombre vacío','error');return;}
  if(!act){toast('Ingresa tu contraseña actual','error');return;}
  const u=APP.user;
  const pwOk=String(u.password||u.contrasena||'').trim()===act;
  if(!pwOk){toast('Contraseña actual incorrecta','error');return;}
  if(nw&&nw.length<6){toast('Mínimo 6 caracteres','error');return;}
  if(nw&&nw!==cf){toast('Las contraseñas no coinciden','error');return;}
  const data={...u,nombre:nom}; if(nw)data.password=nw;
  DB.save('usuarios',data); APP.user=data; C.set('session',data);
  toast('Perfil actualizado ✓','success');
  ['pf-act','pf-new','pf-conf'].forEach(id=>{const e=ge(id);if(e)e.value=''});
}

// ── INIT ─────────────────────────────────────────────────────────────────────
(function(){
  // Detectar si viene de un QR
  const params = new URLSearchParams(window.location.search);
  const extId = params.get('e');
  if(extId){
    // Mostrar portal público sin login
    showPortalQR(extId);
    return;
  }

  Object.keys(localStorage).forEach(k=>{ if(k.startsWith('safety_')||k.startsWith('scrm_')||k.startsWith('x_s_')) localStorage.removeItem(k) });
  ['clientes','extintores','recolecciones','entregas','laboratorio','materiales','visitas','alertas','prestamos','auditoria','usuarios'].forEach(t=>{ if(!C.get(t)) C.set(t,[]) });
  const s=C.get('session');
  if(s&&s.id){ APP.user=s; refreshAll().then(()=>showApp()); }
  else showLogin();
})();
</script>
